name: Production Close Paid Checkout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CLOSE_PUBLIC_PAID_CHECKOUT_NOW to continue"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-billing-launch-transition
  cancel-in-progress: false

jobs:
  close:
    if: ${{ inputs.confirmation == 'CLOSE_PUBLIC_PAID_CHECKOUT_NOW' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.PRODUCTION_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_CpksedcfKT4t6GvlcqxHMRjg
      VERCEL_PROJECT_ID: prj_LMlusvAi1f5ByOZM02xyXc1MRxph
      VERCEL_CLI_VERSION: 59.3.0
      PRODUCTION_CANONICAL_HOST: ir.sa

    steps:
      - name: Resolve currently served exact Production release and billing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --silent --show-error --fail --max-time 20 https://ir.sa/api/release)"
          maintenance_json="$(curl --silent --show-error --fail --max-time 20 https://ir.sa/api/maintenance/status)"
          launch_json="$(curl --silent --show-error --fail --max-time 20 https://ir.sa/api/billing/launch-status)"
          canonical_sha="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.releaseSha??""));' "$release_json")"
          test "$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.environment??""));' "$release_json")" = production
          [[ "$canonical_sha" =~ ^[0-9a-f]{40}$ ]] || (echo "Canonical release SHA is invalid" && exit 1)
          node - <<'NODE' "$maintenance_json" "$launch_json" "$canonical_sha"
          const maintenance=JSON.parse(process.argv[2]);
          const launch=JSON.parse(process.argv[3]);
          const sha=process.argv[4];
          if(maintenance.releaseSha!==sha||maintenance.environment!=="production"||maintenance.maintenance!==false)throw new Error("canonical Production is not safely out of maintenance");
          if(launch.releaseSha!==sha||launch.environment!=="production")throw new Error("billing launch endpoint does not match canonical release");
          if(!new Set(["public","rehearsal"]).has(launch.mode))throw new Error(`billing launch is already ${launch.mode}`);
          NODE
          echo "HEE_CANONICAL_RELEASE_SHA=${canonical_sha}" >> "$GITHUB_ENV"

      - name: Resolve successful rehearsal baseline for the currently served release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/production-billing-rehearsal.yml/runs?head_sha=${HEE_CANONICAL_RELEASE_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "hee-v6-rc")][0].id // empty')"
          test -n "$run_id" || (echo "No successful rehearsal baseline exists for canonical release ${HEE_CANONICAL_RELEASE_SHA}" && exit 1)
          rm -rf /tmp/hee-paid-launch-baseline
          mkdir -p /tmp/hee-paid-launch-baseline
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "hee-paid-launch-closed-baseline-${HEE_CANONICAL_RELEASE_SHA}" \
            --dir /tmp/hee-paid-launch-baseline
          baseline="$(find /tmp/hee-paid-launch-baseline -type f -name 'hee-paid-launch-closed-baseline.json' -print -quit)"
          test -n "$baseline" && test -s "$baseline" || (echo "Closed billing baseline artifact is missing" && exit 1)
          echo "HEE_CLOSED_BASELINE_FILE=${baseline}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify baseline deployment is same-SHA closed mode before rollback
        run: |
          set -euo pipefail
          baseline_id="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.id??""));' "$HEE_CLOSED_BASELINE_FILE")"
          baseline_url="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.url??""));' "$HEE_CLOSED_BASELINE_FILE")"
          test -n "$baseline_id" && test -n "$baseline_url"
          release_json="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/release --deployment "$baseline_url" --token "$VERCEL_TOKEN")"
          maintenance_json="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/maintenance/status --deployment "$baseline_url" --token "$VERCEL_TOKEN")"
          launch_json="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/billing/launch-status --deployment "$baseline_url" --token "$VERCEL_TOKEN")"
          node - <<'NODE' "$release_json" "$maintenance_json" "$launch_json"
          const release=JSON.parse(process.argv[2]);
          const maintenance=JSON.parse(process.argv[3]);
          const launch=JSON.parse(process.argv[4]);
          const sha=process.env.HEE_CANONICAL_RELEASE_SHA;
          if(release.releaseSha!==sha||release.environment!=="production")throw new Error("closed baseline release mismatch");
          if(maintenance.releaseSha!==sha||maintenance.environment!=="production"||maintenance.maintenance!==false)throw new Error("closed baseline maintenance mismatch");
          if(launch.releaseSha!==sha||launch.environment!=="production"||launch.mode!=="closed")throw new Error("baseline is not exact-SHA closed billing mode");
          NODE
          {
            echo "HEE_CLOSED_BASELINE_ID=${baseline_id}"
            echo "HEE_CLOSED_BASELINE_URL=${baseline_url}"
          } >> "$GITHUB_ENV"

      - name: Roll canonical Production back to exact-SHA closed billing baseline
        run: |
          set -euo pipefail
          npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback "$HEE_CLOSED_BASELINE_URL" --yes --timeout 5m --token "$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback status --timeout 60s --token "$VERCEL_TOKEN"
          for attempt in $(seq 1 20); do
            if launch_json="$(curl --silent --show-error --fail --max-time 10 https://ir.sa/api/billing/launch-status 2>/dev/null)" && \
               node -e 'const b=JSON.parse(process.argv[1]);if(b.releaseSha!==process.env.HEE_CANONICAL_RELEASE_SHA||b.environment!=="production"||b.mode!=="closed")process.exit(1);' "$launch_json"; then
              echo "production-close-paid-checkout: PASS release=${HEE_CANONICAL_RELEASE_SHA} baseline=${HEE_CLOSED_BASELINE_ID}"
              exit 0
            fi
            sleep 5
          done
          echo "Canonical billing launch mode did not converge to closed"
          exit 1
