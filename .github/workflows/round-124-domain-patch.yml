name: Round 124 Canonical Domain Patch

on:
  push:
    branches:
      - round-124-domain-migration-ir-sa
    paths:
      - .github/workflows/round-124-domain-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round-124-domain-migration-ir-sa
          fetch-depth: 0

      - name: Apply guarded canonical-domain replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          exact = {
              "apps/web/scripts/billing-renewal-worker.ts": [
                  ('callbackUrl: "https://hee.sa/dashboard/billing/manage",',
                   'callbackUrl: "https://ir.sa/dashboard/billing/manage",'),
              ],
              "apps/web/components/public-business-page-v10-light.tsx": [
                  ('<p className="mt-2 text-[9px] text-[#9a929f]">hee.sa</p>',
                   '<p className="mt-2 text-[9px] text-[#9a929f]">ir.sa</p>'),
              ],
          }

          stale_test_expectations = [
              "apps/web/tests/auth-hardening-source-guards.test.ts",
              "apps/web/tests/billing-callback-origin-guard.test.ts",
              "apps/web/tests/billing-operations-worker-source-guards.test.ts",
              "apps/web/tests/business-store-foundation.test.ts",
              "apps/web/tests/oauth-no-open-redirect-source-guards.test.ts",
              "apps/web/tests/oauth-provider-shape-source-guards.test.ts",
              "apps/web/tests/password-reset-recovery-source-guards.test.ts",
              "apps/web/tests/production-maintenance-lock-source-guards.test.ts",
              "apps/web/tests/production-release-guards.test.ts",
              "apps/web/tests/production-runtime-identity.test.ts",
              "apps/web/tests/public-identity-source-guards.test.ts",
          ]

          changed = []
          for file_name, replacements in exact.items():
              path = Path(file_name)
              text = path.read_text()
              original = text
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{file_name}: expected exactly one guarded occurrence of {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
              if text != original:
                  changed.append(file_name)

          for file_name in stale_test_expectations:
              path = Path(file_name)
              text = path.read_text()
              original = text
              text = text.replace(r"hee\.sa", r"ir\.sa")
              text = text.replace("hee.sa", "ir.sa")
              if text == original:
                  raise SystemExit(f"{file_name}: no legacy canonical-domain expectation found")
              path.write_text(text)
              changed.append(file_name)

          if len(changed) != 13:
              raise SystemExit(f"expected 13 changed files, got {len(changed)}: {changed}")

          # The legacy-domain guard itself must remain untouched; it is supposed to reject hee.sa.
          legacy_guard = Path("apps/web/tests/legacy-domain-source-guards.test.ts").read_text()
          if "hee.sa" not in legacy_guard:
              raise SystemExit("legacy-domain guard was unexpectedly altered")

          print("Changed files:")
          for name in changed:
              print(f"- {name}")
          PY

      - name: Prove only intended files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test "$(git status --short | wc -l | tr -d ' ')" = "13"

      - name: Commit guarded migration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/scripts/billing-renewal-worker.ts \
            apps/web/components/public-business-page-v10-light.tsx \
            apps/web/tests/auth-hardening-source-guards.test.ts \
            apps/web/tests/billing-callback-origin-guard.test.ts \
            apps/web/tests/billing-operations-worker-source-guards.test.ts \
            apps/web/tests/business-store-foundation.test.ts \
            apps/web/tests/oauth-no-open-redirect-source-guards.test.ts \
            apps/web/tests/oauth-provider-shape-source-guards.test.ts \
            apps/web/tests/password-reset-recovery-source-guards.test.ts \
            apps/web/tests/production-maintenance-lock-source-guards.test.ts \
            apps/web/tests/production-release-guards.test.ts \
            apps/web/tests/production-runtime-identity.test.ts \
            apps/web/tests/public-identity-source-guards.test.ts
          git commit -m "fix(domain): finish ir.sa runtime and guard migration"
          git push origin HEAD:round-124-domain-migration-ir-sa
