name: RC Quality

on:
  push:
    branches: [hee-v6-rc]
    paths:
      - "apps/web/**"
      - ".github/workflows/rc-quality.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/rc-quality.yml"

concurrency:
  group: rc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hee_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hee_ci
      APP_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3000
      SESSION_SECRET: ci-only-not-for-production
      PAYMENT_PROVIDER: mock
      STORAGE_DRIVER: database
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify migrations on clean PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify customer data retention guards
        run: npm run data:retention-audit
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
