name: RC Quality

on:
  push:
    branches: [hee-v6-rc]
    paths:
      - "apps/web/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "ops/**"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "ops/**"

concurrency:
  group: rc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hee_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hee_ci
      APP_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3000
      SESSION_SECRET: ci-only-not-for-production
      PAYMENT_PROVIDER: mock
      STORAGE_DRIVER: database
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PGPASSWORD: postgres
      RC_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact RC candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RC_CANDIDATE_SHA }}
          fetch-depth: 1
      - name: Prove checkout matches RC candidate SHA
        working-directory: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_CANDIDATE_SHA" || (echo "RC checkout does not match candidate SHA" && exit 1)
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify migrations on clean PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify customer data retention guards
        env:
          ALLOW_DATA_RETENTION_AUDIT: "true"
        run: npm run data:retention-audit
      - name: Verify retention pruning dry run
        run: npm run retention:dry-run
      - name: Verify public transaction guards
        env:
          ALLOW_PUBLIC_TRANSACTIONS_AUDIT: "true"
        run: npm run public:transactions-audit
      - name: Verify billing database integrity
        env:
          ALLOW_BILLING_INTEGRITY_AUDIT: "true"
        run: npm run billing:integrity-audit
      - name: Seed backup/restore audit fixture
        env:
          ALLOW_BACKUP_RESTORE_AUDIT_SEED: "true"
        run: npm run backup:audit-seed
      - name: Verify billing entitlement state consistency
        run: npm run billing:state-audit
      - name: Create PostgreSQL backup
        run: pg_dump --host=127.0.0.1 --port=5432 --username=postgres --dbname=hee_ci --format=custom --file=/tmp/hee-ci.dump
      - name: Restore backup into a fresh database
        run: |
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --command='DROP DATABASE IF EXISTS hee_restore;'
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --command='CREATE DATABASE hee_restore;'
          pg_restore --host=127.0.0.1 --port=5432 --username=postgres --dbname=hee_restore --no-owner --no-privileges /tmp/hee-ci.dump
      - name: Verify restored customer data
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hee_restore
        run: npm run backup:audit-verify
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run current RC owner workflow
        run: npm run test:rc
      - name: Run platform admin workflow
        env:
          HEE_ADMIN_EMAILS: rc-platform-admin@hee.test
        run: npm run test:admin
      - name: Run directory workflow
        run: npm run test:directory
      - name: Run public transactions workflow
        run: npm run test:transactions
      - name: Run email ownership verification workflow
        run: npm run test:email-verification

  production-first-bootstrap:
    name: One-time Production database bootstrap
    needs: unit-tests
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[first-production-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EXPECTED_PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      BILLING_RENEWAL_ENABLED: ${{ vars.PRODUCTION_BILLING_RENEWAL_ENABLED }}
      BILLING_OPERATIONS_READY: ${{ vars.PRODUCTION_BILLING_OPERATIONS_READY }}
      PAID_CHECKOUT_PUBLIC_ENABLED: ${{ vars.PRODUCTION_PAID_CHECKOUT_PUBLIC_ENABLED }}
      BILLING_REHEARSAL_USER_EMAIL: ${{ vars.PRODUCTION_BILLING_REHEARSAL_USER_EMAIL }}
      NODE_ENV: production
      VERCEL_ENV: production
      SEED_DEMO_BUSINESS: 'false'
    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Resolve isolated HEE Production database identities
        run: node .github/scripts/resolve-hee-production-database-urls.mjs
      - name: Require first-launch safety posture
        run: |
          set -euo pipefail
          [[ "${BILLING_RENEWAL_ENABLED:-false}" == "false" ]]
          [[ "${BILLING_OPERATIONS_READY:-false}" == "false" ]]
          [[ "${PAID_CHECKOUT_PUBLIC_ENABLED:-false}" == "false" ]]
          [[ -z "${BILLING_REHEARSAL_USER_EMAIL:-}" ]]
          test -n "${DATABASE_URL:-}"
          test -n "${RESTORE_DATABASE_URL:-}"
          test -n "${EXPECTED_PRODUCTION_DB_HOST:-}"
          node .github/scripts/require-production-database-safety.mjs DATABASE_URL RESTORE_DATABASE_URL
      - name: Prove both bootstrap databases are empty
        run: |
          set -euo pipefail
          prod_tables="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename")"
          restore_tables="$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename")"
          [[ -z "$prod_tables" ]] || { echo "Production schema is not empty"; printf '%s\n' "$prod_tables"; exit 1; }
          [[ -z "$restore_tables" ]] || { echo "Restore schema is not empty"; printf '%s\n' "$restore_tables"; exit 1; }
          echo "first-bootstrap-empty-database-proof: PASS"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact dependencies
        working-directory: apps/web
        run: npm ci
      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate
      - name: Apply reviewed Prisma migrations
        working-directory: apps/web
        run: npx prisma migrate deploy
      - name: Seed canonical plans only
        working-directory: apps/web
        run: npx prisma db seed
      - name: Verify migration history and critical schema
        working-directory: apps/web
        run: |
          set -euo pipefail
          expected="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          applied="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'SELECT COUNT(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')"
          [[ "$applied" == "$expected" ]] || { echo "Migration count mismatch expected=${expected} applied=${applied}"; exit 1; }
          critical="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM (VALUES (to_regclass('public.\"User\"')), (to_regclass('public.\"LegalConsent\"')), (to_regclass('public.\"RequestRateLimit\"')), (to_regclass('public.\"BillingOperationsHeartbeat\"'))) AS t(r) WHERE r IS NOT NULL")"
          [[ "$critical" == "4" ]] || { echo "Critical schema verification failed count=${critical}"; exit 1; }
          plans="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'SELECT COUNT(*) FROM "BusinessPlan" WHERE code IN ('"'"'FREE'"'"','"'"'BUSINESS'"'"','"'"'PRO'"'"')')"
          [[ "$plans" == "3" ]] || { echo "Canonical plan seed incomplete count=${plans}"; exit 1; }
          demo="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM \"User\" WHERE email='demo.preview@hee.local'")"
          [[ "$demo" == "0" ]] || { echo "Demo account must not exist in Production"; exit 1; }
          echo "first-production-database-bootstrap: PASS migrations=${applied} plans=${plans} release=${GITHUB_SHA}"
