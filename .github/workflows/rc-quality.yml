name: RC Quality

on:
  push:
    branches: [hee-v6-rc]
    paths:
      - "apps/web/**"
      - ".github/workflows/rc-quality.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/rc-quality.yml"

concurrency:
  group: rc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hee_ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm run test:unit
