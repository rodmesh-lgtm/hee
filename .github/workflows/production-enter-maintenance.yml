name: Production Enter Maintenance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ENTER_PRODUCTION_MAINTENANCE to continue"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-billing-launch-transition
  cancel-in-progress: false

jobs:
  enter:
    if: ${{ inputs.confirmation == 'ENTER_PRODUCTION_MAINTENANCE' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      VERCEL_TOKEN: ${{ secrets.PRODUCTION_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_CpksedcfKT4t6GvlcqxHMRjg
      VERCEL_PROJECT_ID: prj_LMlusvAi1f5ByOZM02xyXc1MRxph
      VERCEL_CLI_VERSION: 59.3.0
      PRODUCTION_CANONICAL_HOST: ir.sa
      RELEASE_SHA: ${{ github.sha }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EXPECTED_PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PG_POOL_MAX: ${{ vars.PRODUCTION_PG_POOL_MAX }}
      SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
      HEE_FROM_EMAIL: ${{ vars.PRODUCTION_HEE_FROM_EMAIL }}
      MOYASAR_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_MOYASAR_PUBLISHABLE_KEY }}
      MOYASAR_SECRET_KEY: ${{ secrets.PRODUCTION_MOYASAR_SECRET_KEY }}
      MOYASAR_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_MOYASAR_WEBHOOK_SECRET }}
      BILLING_TOKEN_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BILLING_TOKEN_ENCRYPTION_KEY }}
      BILLING_SELLER_LEGAL_NAME_AR: ${{ vars.PRODUCTION_BILLING_SELLER_LEGAL_NAME_AR }}
      BILLING_SELLER_ADDRESS_AR: ${{ vars.PRODUCTION_BILLING_SELLER_ADDRESS_AR }}
      BILLING_TAX_STATUS: ${{ vars.PRODUCTION_BILLING_TAX_STATUS }}
      BILLING_RENEWAL_ENABLED: ${{ vars.PRODUCTION_BILLING_RENEWAL_ENABLED }}
      BILLING_OPERATIONS_READY: ${{ vars.PRODUCTION_BILLING_OPERATIONS_READY }}
      PAID_CHECKOUT_PUBLIC_ENABLED: ${{ vars.PRODUCTION_PAID_CHECKOUT_PUBLIC_ENABLED }}
      BILLING_REHEARSAL_USER_EMAIL: ${{ vars.PRODUCTION_BILLING_REHEARSAL_USER_EMAIL }}
      STORAGE_DRIVER: ${{ vars.PRODUCTION_STORAGE_DRIVER }}
      S3_ENDPOINT: ${{ vars.PRODUCTION_S3_ENDPOINT }}
      S3_REGION: ${{ vars.PRODUCTION_S3_REGION }}
      S3_BUCKET: ${{ vars.PRODUCTION_S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_S3_SECRET_ACCESS_KEY }}
      S3_FORCE_PATH_STYLE: ${{ vars.PRODUCTION_S3_FORCE_PATH_STYLE }}
      GOOGLE_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET }}
      APPLE_CLIENT_ID: ${{ secrets.PRODUCTION_APPLE_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ secrets.PRODUCTION_APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.PRODUCTION_APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.PRODUCTION_APPLE_PRIVATE_KEY }}
      HETZNER_HOST: ${{ vars.PRODUCTION_HETZNER_HOST }}
      HETZNER_USER: ${{ vars.PRODUCTION_HETZNER_USER }}
      HETZNER_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_HETZNER_SSH_PRIVATE_KEY }}
      HETZNER_KNOWN_HOSTS: ${{ secrets.PRODUCTION_HETZNER_KNOWN_HOSTS }}

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Canonicalize verified Production database URL before release attestation
        run: node ../../.github/scripts/require-production-database-safety.mjs DATABASE_URL

      - name: Require content-proven RC Quality for release
        uses: ./.github/actions/require-release-quality
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require successful Production Preflight V2 for exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          preflight_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/production-preflight-v2.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "hee-v6-rc")] | length')"
          test "$preflight_runs" -ge 1 || (echo "Exact release SHA has no green Production Preflight V2 run" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify pinned Vercel CLI version
        working-directory: .
        run: |
          set -euo pipefail
          cli_version="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" --version | tr -d '\r' | tail -n 1)"
          case "$cli_version" in *"${VERCEL_CLI_VERSION}"*) ;; *) echo "Unexpected Vercel CLI version: ${cli_version}"; exit 1 ;; esac

      - name: Capture current canonical Production deployment for rollback
        working-directory: .
        run: node .github/scripts/capture-current-vercel-production.mjs /tmp/hee-pre-maintenance-production.json

      - name: Sync reviewed GitHub production environment without persisting maintenance mode
        working-directory: .
        env:
          APP_ENV: production
          APP_URL: https://ir.sa
          AUTH_ORIGIN: https://ir.sa
          NEXT_PUBLIC_APP_URL: https://ir.sa
          API_URL: https://ir.sa
          PAYMENT_PROVIDER: moyasar
          S3_ALLOW_INSECURE: "false"
        run: node .github/scripts/sync-vercel-production-env.mjs

      - name: Stage exact release in maintenance mode without assigning domains
        id: stage
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_REF: hee-v6-rc
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --env RELEASE_SHA="$GITHUB_SHA" --build-env RELEASE_SHA="$GITHUB_SHA" \
            --env PRODUCTION_MAINTENANCE_MODE=true --build-env PRODUCTION_MAINTENANCE_MODE=true)"
          test -n "$deployment_url" || (echo "Vercel did not return a staged maintenance deployment URL" && exit 1)
          printf '%s' "$deployment_url" > /tmp/hee-maintenance-deployment-url

      - name: Prove staged maintenance blocks UI and write API before promotion
        id: stage_smoke
        working-directory: .
        run: |
          set -euo pipefail
          deployment_url="$(cat /tmp/hee-maintenance-deployment-url)"
          status_json="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/maintenance/status --deployment "$deployment_url" --token "$VERCEL_TOKEN")"
          maintenance="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.maintenance===true));' "$status_json")"
          release_sha="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.releaseSha??""));' "$status_json")"
          release_env="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.environment??""));' "$status_json")"
          test "$maintenance" = "true" || (echo "Staged deployment is not in maintenance mode" && exit 1)
          test "$release_sha" = "$GITHUB_SHA" || (echo "Staged maintenance release mismatch" && exit 1)
          test "$release_env" = "production" || (echo "Staged maintenance deployment is not production environment" && exit 1)

          ui_code="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /register --deployment "$deployment_url" --token "$VERCEL_TOKEN" -- --silent --output /tmp/hee-maintenance-ui.html --write-out '%{http_code}')"
          test "$ui_code" = "503" || (echo "Maintenance UI probe returned HTTP ${ui_code}" && exit 1)
          grep -q 'صيانة مجدولة' /tmp/hee-maintenance-ui.html || (echo "Maintenance UI body is missing" && exit 1)

          write_code="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/public/orders --deployment "$deployment_url" --token "$VERCEL_TOKEN" -- --silent --request POST --header 'Content-Type: application/json' --data '{}' --output /tmp/hee-maintenance-write.html --write-out '%{http_code}')"
          test "$write_code" = "503" || (echo "Maintenance write probe returned HTTP ${write_code}" && exit 1)
          grep -q 'صيانة مجدولة' /tmp/hee-maintenance-write.html || (echo "Maintenance write API did not hit the central gate" && exit 1)

      - name: Promote verified maintenance deployment to canonical Production
        id: promote
        working-directory: .
        run: |
          set -euo pipefail
          deployment_url="$(cat /tmp/hee-maintenance-deployment-url)"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$deployment_url" --yes --timeout 5m --token "$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote status --timeout 60s --token "$VERCEL_TOKEN"

      - name: Prove canonical Production is exact-SHA maintenance
        id: canonical_maintenance
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if status_json="$(curl --silent --show-error --fail --max-time 10 https://ir.sa/api/maintenance/status 2>/dev/null)"; then
              maintenance="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.maintenance===true));' "$status_json")"
              release_sha="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.releaseSha??""));' "$status_json")"
              release_env="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.environment??""));' "$status_json")"
              if [ "$maintenance" = "true" ] && [ "$release_sha" = "$GITHUB_SHA" ] && [ "$release_env" = "production" ]; then break; fi
            fi
            if [ "$attempt" = "30" ]; then echo "Canonical maintenance status did not converge"; exit 1; fi
            sleep 10
          done
          code="$(curl --silent --show-error --output /tmp/hee-canonical-maintenance.html --write-out '%{http_code}' --max-time 20 https://ir.sa/)"
          test "$code" = "503" || (echo "Canonical homepage is not blocked by maintenance (HTTP ${code})" && exit 1)
          grep -q 'صيانة مجدولة' /tmp/hee-canonical-maintenance.html || (echo "Canonical maintenance page body is missing" && exit 1)

      - name: Roll back web only if maintenance never became canonically proven
        if: ${{ failure() && steps.stage_smoke.outcome == 'success' && steps.canonical_maintenance.outcome != 'success' }}
        working-directory: .
        run: |
          set -euo pipefail
          previous_id="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.id));' /tmp/hee-pre-maintenance-production.json)"
          previous_url="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.url));' /tmp/hee-pre-maintenance-production.json)"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback "$previous_url" --yes --timeout 5m --token "$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback status --timeout 60s --token "$VERCEL_TOKEN"
          current_json="$(curl --silent --show-error --fail --max-time 20 -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v13/deployments/${PRODUCTION_CANONICAL_HOST}?teamId=${VERCEL_ORG_ID}")"
          current_id="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.id??""));' "$current_json")"
          test "$current_id" = "$previous_id" || (echo "Maintenance rollback failed to restore ${previous_id}" && exit 1)

      - name: Validate pinned Hetzner SSH configuration
        if: ${{ steps.canonical_maintenance.outcome == 'success' && (env.BILLING_RENEWAL_ENABLED == 'true' || env.BILLING_OPERATIONS_READY == 'true') }}
        working-directory: .
        run: |
          set -euo pipefail
          test -n "$HETZNER_HOST" || (echo "PRODUCTION_HETZNER_HOST is not configured" && exit 1)
          test -n "$HETZNER_USER" || (echo "PRODUCTION_HETZNER_USER is not configured" && exit 1)
          test -n "$HETZNER_SSH_PRIVATE_KEY" || (echo "PRODUCTION_HETZNER_SSH_PRIVATE_KEY is not configured" && exit 1)
          test -n "$HETZNER_KNOWN_HOSTS" || (echo "PRODUCTION_HETZNER_KNOWN_HOSTS is not configured" && exit 1)
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hee-production"
          chmod 0600 "$HOME/.ssh/hee-production"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Lock and quiesce billing worker without killing an active cycle
        id: worker_lock
        if: ${{ steps.canonical_maintenance.outcome == 'success' && (env.BILLING_RENEWAL_ENABLED == 'true' || env.BILLING_OPERATIONS_READY == 'true') }}
        working-directory: .
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hee-production" -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n install -d -o root -g hee -m 0750 /etc/hee
          sudo -n touch /etc/hee/maintenance.lock
          sudo -n chown root:hee /etc/hee/maintenance.lock
          sudo -n chmod 0640 /etc/hee/maintenance.lock
          sudo -n install -d -o root -g root -m 0755 /etc/systemd/system/hee-billing-renew.service.d
          printf '%s\n' '[Unit]' 'ConditionPathExists=!/etc/hee/maintenance.lock' | sudo -n tee /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf >/dev/null
          sudo -n chmod 0644 /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf
          sudo -n systemctl daemon-reload
          sudo -n systemctl disable --now hee-billing-renew.timer >/dev/null 2>&1 || true
          sudo -n systemctl disable --now hee-whatsapp-operations.timer >/dev/null 2>&1 || true
          for _ in $(seq 1 120); do
            if ! sudo -n systemctl is-active --quiet hee-billing-renew.service; then break; fi
            sleep 10
          done
          if sudo -n systemctl is-active --quiet hee-billing-renew.service; then
            echo 'Billing cycle did not finish within 20 minutes; maintenance remains active and migration is forbidden'
            exit 1
          fi
          for _ in $(seq 1 90); do
            if ! sudo -n systemctl is-active --quiet hee-whatsapp-operations.service; then break; fi
            sleep 10
          done
          if sudo -n systemctl is-active --quiet hee-whatsapp-operations.service; then
            echo 'WhatsApp operations cycle did not finish within 15 minutes; maintenance remains active and migration is forbidden'
            exit 1
          fi
          test -f /etc/hee/maintenance.lock
          grep -qx 'ConditionPathExists=!/etc/hee/maintenance.lock' /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf
          if sudo -n systemctl is-active --quiet hee-billing-renew.timer; then echo 'Billing timer is still active'; exit 1; fi
          if sudo -n systemctl is-active --quiet hee-whatsapp-operations.timer; then echo 'WhatsApp timer is still active'; exit 1; fi
          REMOTE

      - name: Final maintenance lock proof
        if: ${{ steps.canonical_maintenance.outcome == 'success' && (steps.worker_lock.outcome == 'success' || (env.BILLING_RENEWAL_ENABLED != 'true' && env.BILLING_OPERATIONS_READY != 'true')) }}
        working-directory: .
        run: |
          set -euo pipefail
          status_json="$(curl --silent --show-error --fail --max-time 20 https://ir.sa/api/maintenance/status)"
          node -e 'const b=JSON.parse(process.argv[1]);if(b.maintenance!==true||b.releaseSha!==process.env.GITHUB_SHA||b.environment!=="production")process.exit(1);' "$status_json"
          if [ "$BILLING_RENEWAL_ENABLED" = "true" ] || [ "$BILLING_OPERATIONS_READY" = "true" ]; then
            ssh -i "$HOME/.ssh/hee-production" -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
              "test -f /etc/hee/maintenance.lock && ! sudo -n systemctl is-active --quiet hee-billing-renew.timer && ! sudo -n systemctl is-active --quiet hee-billing-renew.service"
          fi
          echo "production-enter-maintenance: PASS for ${GITHUB_SHA}; web writes blocked and billing worker quiesced"

      - name: Remove runner-local credentials and probes
        if: always()
        working-directory: .
        run: rm -f "$HOME/.ssh/hee-production" "$HOME/.ssh/known_hosts" /tmp/hee-pre-maintenance-production.json /tmp/hee-maintenance-deployment-url /tmp/hee-maintenance-ui.html /tmp/hee-maintenance-write.html /tmp/hee-canonical-maintenance.html
