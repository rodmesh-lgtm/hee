name: Production Backup Restore Proof

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

jobs:
  backup-restore-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RESTORE_DATABASE_URL: ${{ secrets.PRODUCTION_RESTORE_DATABASE_URL }}
      EXPECTED_PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PRODUCTION_BACKUP_PASSPHRASE: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require verify-full PostgreSQL transport before backup or restore
        run: node .github/scripts/require-production-database-safety.mjs DATABASE_URL RESTORE_DATABASE_URL

      - name: Verify isolated source, restore and backup prerequisites
        run: |
          test -n "$DATABASE_URL" || (echo "PRODUCTION_DATABASE_URL is not configured" && exit 1)
          test -n "$RESTORE_DATABASE_URL" || (echo "PRODUCTION_RESTORE_DATABASE_URL is not configured" && exit 1)
          test -n "$PRODUCTION_BACKUP_PASSPHRASE" || (echo "PRODUCTION_BACKUP_PASSPHRASE is not configured" && exit 1)
          test "${#PRODUCTION_BACKUP_PASSPHRASE}" -ge 32 || (echo "PRODUCTION_BACKUP_PASSPHRASE must be at least 32 characters" && exit 1)

      - name: Create production backup
        run: |
          pg_dump "$DATABASE_URL" --format=custom --file=/tmp/hee-production.dump
          test -s /tmp/hee-production.dump

      - name: Encrypt backup
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/hee-production.dump \
            -out /tmp/hee-production-${GITHUB_RUN_ID}.dump.enc \
            -pass env:PRODUCTION_BACKUP_PASSPHRASE
          test -s /tmp/hee-production-${GITHUB_RUN_ID}.dump.enc

      - name: Reset isolated restore schema
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'

      - name: Restore production backup into clean isolated database
        run: |
          pg_restore --exit-on-error --dbname="$RESTORE_DATABASE_URL" --no-owner --no-privileges /tmp/hee-production.dump

      - name: Prove restored schema and critical data signatures
        working-directory: apps/web
        env:
          SOURCE_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.PRODUCTION_RESTORE_DATABASE_URL }}
        run: |
          npm ci
          npm run backup:production-proof

      - name: Preserve encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: hee-production-backup-${{ github.run_id }}
          path: /tmp/hee-production-${{ github.run_id }}.dump.enc
          if-no-files-found: error
          retention-days: 14

      - name: Remove local backup copies
        if: always()
        run: rm -f /tmp/hee-production.dump /tmp/hee-production-${GITHUB_RUN_ID}.dump.enc
