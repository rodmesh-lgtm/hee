name: Dashboard Visual Audit

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/dashboard-visual-audit.yml"

concurrency:
  group: dashboard-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hee_visual
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hee_visual"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hee_visual
      APP_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3000
      SESSION_SECRET: ci-visual-only-not-for-production
      PAYMENT_PROVIDER: mock
      STORAGE_DRIVER: database
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      INFRO_VISUAL_AUDIT_DIR: /tmp/infro-visual-audit
      INFRO_REMINDER_WHATSAPP_ENABLED: "false"
      # Synthetic webhook credentials for isolated CI only; never send to Meta.
      META_APP_ID: ci-visual
      META_APP_SECRET: ci-visual-webhook-secret-only
      META_BUSINESS_ID: ci-visual
      META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ci-visual
      META_WHATSAPP_SYSTEM_USER_ID: ci-visual
      META_WHATSAPP_SYSTEM_USER_TOKEN: ci-visual-token-never-for-production
      META_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-visual-verify-token-never-production
      META_WHATSAPP_GRAPH_VERSION: v23.0
      META_WHATSAPP_CREDENTIAL_ENCRYPTION_KEY: ci-visual-key-never-for-production-123456
      META_WHATSAPP_CREDENTIAL_KEY_VERSION: v1
      META_WHATSAPP_BILLING_MODE: customer_meta
      HEE_ADMIN_EMAILS: infro-visual-admin@hee.test
      GOOGLE_CLIENT_ID: infro-visual-audit.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-visual-google-secret-not-for-production
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture authenticated product surfaces and execution flow
        run: npx playwright test tests/dashboard-visual-audit.spec.ts tests/business-memory-reminder-flow.spec.ts
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infro-dashboard-visual-audit
          path: /tmp/infro-visual-audit
          if-no-files-found: warn
          retention-days: 7
