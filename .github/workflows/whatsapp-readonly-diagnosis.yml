name: WhatsApp Post-repair Verification
on:
  push:
    branches: [ops/whatsapp-readonly-diagnosis-20261005]
    paths: [.github/workflows/whatsapp-readonly-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EXPECTED_PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      VERCEL_TOKEN: ${{ secrets.PRODUCTION_VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_LMlusvAi1f5ByOZM02xyXc1MRxph
      VERCEL_ORG_ID: team_CpksedcfKT4t6GvlcqxHMRjg
      PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
      PGCONNECT_TIMEOUT: 10
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=15000"
    steps:
      - uses: actions/checkout@v7
      - name: Verify existing isolated production database identity
        run: node .github/scripts/require-production-database-safety.mjs DATABASE_URL
      - name: Run existing authorized official worker once
        env:
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
        run: |
          test "${#CRON_SECRET}" -ge 32
          curl --silent --show-error --fail-with-body --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" https://ir.sa/api/cron/whatsapp-operations
      - name: Verify fresh complete outbound heartbeat
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN READ ONLY;
          SELECT "lastErrorCode", "details"->>'state' AS state,
            "details"->>'mode' AS mode,
            "lastSucceededAt">CURRENT_TIMESTAMP-INTERVAL '10 minutes' AS fresh,
            "releaseSha"='fe9c0a8e6a21ea576dbe3d2ad7b23bf45c434e5f' AS exact_release,
            ("details"->'completedStages') ? 'whatsapp:campaigns' AS campaigns_complete,
            ("details"->'completedStages') ? 'whatsapp:deliveries' AS deliveries_complete
          FROM "WhatsAppOperationsHeartbeat" WHERE id='whatsapp-operations';
          SELECT COUNT(*) AS pending_webhooks FROM "WhatsAppWebhookEvent" WHERE "processedAt" IS NULL;
          COMMIT;
          SQL
