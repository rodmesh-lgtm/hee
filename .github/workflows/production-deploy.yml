name: Production Web Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_EXACT_RELEASE_TO_PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_EXACT_RELEASE_TO_PRODUCTION' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      VERCEL_TOKEN: ${{ secrets.PRODUCTION_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_CpksedcfKT4t6GvlcqxHMRjg
      VERCEL_PROJECT_ID: prj_LMlusvAi1f5ByOZM02xyXc1MRxph
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require green RC Quality for exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/rc-quality.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "hee-v6-rc")] | length')"
          test "$successful_runs" -ge 1 || (echo "Exact release SHA has no green RC Quality push run on hee-v6-rc" && exit 1)

      - name: Verify deployment credential and project identity
        working-directory: .
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || (echo "PRODUCTION_VERCEL_TOKEN is not configured" && exit 1)
          project_json="$(curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.id !== process.env.VERCEL_PROJECT_ID) throw new Error("Unexpected Vercel project");
            const domains = Array.isArray(body.alias) ? body.alias : [];
            void domains;
          ' "$project_json"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify production schema is already migrated
        run: npx prisma migrate status

      - name: Deploy exact checkout as a fresh Production build
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_REF: hee-v6-rc
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")"
          test -n "$deployment_url" || (echo "Vercel did not return a production deployment URL" && exit 1)
          printf '%s' "$deployment_url" > /tmp/hee-production-deployment-url

      - name: Verify canonical domain serves exact release SHA
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if release_json="$(curl --silent --show-error --fail --max-time 10 https://hee.sa/api/release 2>/dev/null)"; then
              release_sha="$(node -e 'const body=JSON.parse(process.argv[1]); process.stdout.write(String(body.releaseSha ?? ""));' "$release_json")"
              release_env="$(node -e 'const body=JSON.parse(process.argv[1]); process.stdout.write(String(body.environment ?? ""));' "$release_json")"
              if [ "$release_sha" = "$GITHUB_SHA" ] && [ "$release_env" = "production" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "hee.sa did not converge to exact production release ${GITHUB_SHA}"
          exit 1

      - name: Verify baseline customer surfaces after production deploy
        working-directory: .
        run: |
          set -euo pipefail
          for path in / /register /login /terms /privacy /contact /demo; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 "https://hee.sa${path}")"
            case "$code" in
              200|301|302|303|307|308) ;;
              *) echo "Production surface ${path} returned HTTP ${code}"; exit 1 ;;
            esac
          done

      - name: Deployment summary
        working-directory: .
        run: |
          echo "production-web-deploy: PASS for ${GITHUB_SHA}"
          echo "Deployment URL: $(cat /tmp/hee-production-deployment-url)"
