name: Production Web Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_EXACT_RELEASE_TO_PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-billing-launch-transition
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_EXACT_RELEASE_TO_PRODUCTION' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      VERCEL_TOKEN: ${{ secrets.PRODUCTION_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_CpksedcfKT4t6GvlcqxHMRjg
      VERCEL_PROJECT_ID: prj_LMlusvAi1f5ByOZM02xyXc1MRxph
      VERCEL_CLI_VERSION: 59.3.0
      PRODUCTION_CANONICAL_HOST: ir.sa
      RELEASE_SHA: ${{ github.sha }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EXPECTED_PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PG_POOL_MAX: ${{ vars.PRODUCTION_PG_POOL_MAX }}
      SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
      HEE_FROM_EMAIL: ${{ vars.PRODUCTION_HEE_FROM_EMAIL }}
      MOYASAR_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_MOYASAR_PUBLISHABLE_KEY }}
      MOYASAR_SECRET_KEY: ${{ secrets.PRODUCTION_MOYASAR_SECRET_KEY }}
      MOYASAR_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_MOYASAR_WEBHOOK_SECRET }}
      BILLING_TOKEN_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BILLING_TOKEN_ENCRYPTION_KEY }}
      BILLING_SELLER_LEGAL_NAME_AR: ${{ vars.PRODUCTION_BILLING_SELLER_LEGAL_NAME_AR }}
      BILLING_SELLER_ADDRESS_AR: ${{ vars.PRODUCTION_BILLING_SELLER_ADDRESS_AR }}
      BILLING_TAX_STATUS: ${{ vars.PRODUCTION_BILLING_TAX_STATUS }}
      BILLING_RENEWAL_ENABLED: ${{ vars.PRODUCTION_BILLING_RENEWAL_ENABLED }}
      BILLING_OPERATIONS_READY: ${{ vars.PRODUCTION_BILLING_OPERATIONS_READY }}
      PAID_CHECKOUT_PUBLIC_ENABLED: ${{ vars.PRODUCTION_PAID_CHECKOUT_PUBLIC_ENABLED }}
      BILLING_REHEARSAL_USER_EMAIL: ${{ vars.PRODUCTION_BILLING_REHEARSAL_USER_EMAIL }}
      STORAGE_DRIVER: ${{ vars.PRODUCTION_STORAGE_DRIVER }}
      S3_ENDPOINT: ${{ vars.PRODUCTION_S3_ENDPOINT }}
      S3_REGION: ${{ vars.PRODUCTION_S3_REGION }}
      S3_BUCKET: ${{ vars.PRODUCTION_S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_S3_SECRET_ACCESS_KEY }}
      S3_FORCE_PATH_STYLE: ${{ vars.PRODUCTION_S3_FORCE_PATH_STYLE }}
      GOOGLE_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET }}
      APPLE_CLIENT_ID: ${{ secrets.PRODUCTION_APPLE_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ secrets.PRODUCTION_APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.PRODUCTION_APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.PRODUCTION_APPLE_PRIVATE_KEY }}

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Canonicalize verified Production database URL before release attestation
        run: node ../../.github/scripts/require-production-database-safety.mjs DATABASE_URL

      - name: Require content-proven RC Quality for release
        uses: ./.github/actions/require-release-quality
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require successful Production Preflight V2 and coherent exact-SHA maintenance lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count_green_dispatches() {
            workflow="$1"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "hee-v6-rc")] | length'
          }
          preflight_runs="$(count_green_dispatches production-preflight-v2.yml)"
          maintenance_runs="$(count_green_dispatches production-enter-maintenance.yml)"
          migration_runs="$(count_green_dispatches production-migrations.yml)"
          test "$preflight_runs" -ge 1 || (echo "Exact release SHA has no green Production Preflight V2 run" && exit 1)
          if [ "$maintenance_runs" -ge 1 ] && [ "$migration_runs" -lt 1 ]; then
            echo "Exact SHA entered Production maintenance but has no fully successful Production Migrations run; refusing live web cutover"
            exit 1
          fi
          echo "web-lifecycle-evidence: preflight=${preflight_runs} maintenance=${maintenance_runs} migrations=${migration_runs}"

      - name: Verify deployment credential and project identity
        working-directory: .
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || (echo "PRODUCTION_VERCEL_TOKEN is not configured" && exit 1)
          project_json="$(curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (String(body.id ?? "") !== process.env.VERCEL_PROJECT_ID) throw new Error("Unexpected Vercel project");
            if (String(body.accountId ?? "") !== process.env.VERCEL_ORG_ID) throw new Error("Unexpected Vercel team");
          ' "$project_json"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify pinned Vercel CLI version
        working-directory: .
        run: |
          set -euo pipefail
          cli_version="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" --version | tr -d '\r' | tail -n 1)"
          case "$cli_version" in *"${VERCEL_CLI_VERSION}"*) ;; *) echo "Unexpected Vercel CLI version: ${cli_version}"; exit 1 ;; esac

      - name: Install dependencies
        run: npm ci

      - name: Verify production schema is already migrated
        run: npx prisma migrate status

      - name: Capture current canonical Production deployment for rollback
        id: capture
        working-directory: .
        run: node .github/scripts/capture-current-vercel-production.mjs /tmp/hee-previous-production.json

      - name: Sync reviewed GitHub production environment to Vercel Production
        working-directory: .
        env:
          APP_ENV: production
          APP_URL: https://ir.sa
          AUTH_ORIGIN: https://ir.sa
          NEXT_PUBLIC_APP_URL: https://ir.sa
          API_URL: https://ir.sa
          PAYMENT_PROVIDER: moyasar
          S3_ALLOW_INSECURE: "false"
        run: node .github/scripts/sync-vercel-production-env.mjs

      - name: Stage exact checkout as Production deployment without assigning domains
        id: stage
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_REF: hee-v6-rc
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --env RELEASE_SHA="$GITHUB_SHA" --build-env RELEASE_SHA="$GITHUB_SHA")"
          test -n "$deployment_url" || (echo "Vercel did not return a staged Production deployment URL" && exit 1)
          printf '%s' "$deployment_url" > /tmp/hee-staged-production-deployment-url
          echo "Staged Production deployment created without canonical domain assignment"

      - name: Verify staged exact-SHA core web readiness before promotion
        id: stage_smoke
        working-directory: .
        run: |
          set -euo pipefail
          deployment_url="$(cat /tmp/hee-staged-production-deployment-url)"
          release_json="$(curl --silent --show-error --fail --max-time 20 "${deployment_url%/}/api/release")"
          status_json="$(curl --silent --show-error --fail --max-time 20 "${deployment_url%/}/api/maintenance/status")"
          web_ready_json="$(curl --silent --show-error --fail --max-time 20 "${deployment_url%/}/api/health/web-ready")"
          node - <<'NODE' "$release_json" "$status_json" "$web_ready_json"
          const release = JSON.parse(process.argv[2]);
          const status = JSON.parse(process.argv[3]);
          const webReady = JSON.parse(process.argv[4]);
          const sha = process.env.GITHUB_SHA;
          if (release.releaseSha !== sha || release.environment !== "production") throw new Error("Staged release provenance mismatch");
          if (status.releaseSha !== sha || status.environment !== "production" || status.maintenance !== false) throw new Error("Staged Production must be exact-SHA and out of maintenance");
          if (webReady.ready !== true) throw new Error("Staged Production core web runtime is not ready");
          NODE
          for path in / /register /login /terms /privacy /contact /demo; do
            curl --silent --show-error --fail --max-time 20 "${deployment_url%/}${path}" >/dev/null
          done
          echo "staged-production-smoke: PASS for ${GITHUB_SHA}; core web runtime ready; canonical domain is still unchanged"

      - name: Promote verified staged deployment to Production domains
        id: promote
        working-directory: .
        run: |
          set -euo pipefail
          deployment_url="$(cat /tmp/hee-staged-production-deployment-url)"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$deployment_url" --yes --timeout 5m --token "$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote status --timeout 60s --token "$VERCEL_TOKEN"

      - name: Verify canonical domain serves exact-SHA core-ready Production after promotion
        id: canonical_release
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if release_json="$(curl --silent --show-error --fail --max-time 10 https://ir.sa/api/release 2>/dev/null)" && \
               status_json="$(curl --silent --show-error --fail --max-time 10 https://ir.sa/api/maintenance/status 2>/dev/null)" && \
               web_ready_json="$(curl --silent --show-error --fail --max-time 10 https://ir.sa/api/health/web-ready 2>/dev/null)"; then
              if node - <<'NODE' "$release_json" "$status_json" "$web_ready_json"
          const release = JSON.parse(process.argv[2]);
          const status = JSON.parse(process.argv[3]);
          const webReady = JSON.parse(process.argv[4]);
          const sha = process.env.GITHUB_SHA;
          if (release.releaseSha !== sha || release.environment !== "production") process.exit(1);
          if (status.releaseSha !== sha || status.environment !== "production" || status.maintenance !== false) process.exit(1);
          if (webReady.ready !== true) process.exit(1);
          NODE
              then exit 0; fi
            fi
            sleep 10
          done
          echo "ir.sa did not converge to exact core-ready production release ${GITHUB_SHA}"
          exit 1

      - name: Verify baseline customer surfaces after canonical promotion
        id: canonical_smoke
        working-directory: .
        run: |
          set -euo pipefail
          for path in / /register /login /terms /privacy /contact /demo; do
            passed=false
            for attempt in 1 2 3; do
              code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 "https://ir.sa${path}" || true)"
              case "$code" in 200|301|302|303|307|308) passed=true; break ;; esac
              sleep 3
            done
            [ "$passed" = true ] || (echo "Production surface ${path} failed three post-promotion checks" && exit 1)
          done

      - name: Roll back canonical Production on any post-stage promotion failure
        if: ${{ failure() && steps.stage_smoke.outcome == 'success' }}
        working-directory: .
        run: |
          set -euo pipefail
          previous_id="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.id));' /tmp/hee-previous-production.json)"
          previous_url="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.url));' /tmp/hee-previous-production.json)"
          echo "Post-stage cutover verification failed; restoring recorded deployment ${previous_id}"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback "$previous_url" --yes --timeout 5m --token "$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback status --timeout 60s --token "$VERCEL_TOKEN"
          current_json="$(curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${PRODUCTION_CANONICAL_HOST}?teamId=${VERCEL_ORG_ID}")"
          current_id="$(node -e 'const body=JSON.parse(process.argv[1]);process.stdout.write(String(body.id??""));' "$current_json")"
          test "$current_id" = "$previous_id" || (echo "Rollback resolved ${current_id:-unknown}, expected ${previous_id}" && exit 1)
          curl --silent --show-error --fail --max-time 20 https://ir.sa/ >/dev/null
          echo "production-rollback: PASS restored ${previous_id}"

      - name: Deployment summary
        working-directory: .
        run: |
          echo "production-web-deploy: PASS for ${GITHUB_SHA}"
          echo "Deployment URL: $(cat /tmp/hee-staged-production-deployment-url)"

      - name: Remove local deployment records
        if: always()
        working-directory: .
        run: rm -f /tmp/hee-previous-production.json /tmp/hee-staged-production-deployment-url
