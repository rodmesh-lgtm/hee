name: Production Web Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_EXACT_RELEASE_TO_PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_EXACT_RELEASE_TO_PRODUCTION' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      VERCEL_TOKEN: ${{ secrets.PRODUCTION_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_CpksedcfKT4t6GvlcqxHMRjg
      VERCEL_PROJECT_ID: prj_LMlusvAi1f5ByOZM02xyXc1MRxph
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PG_POOL_MAX: ${{ vars.PRODUCTION_PG_POOL_MAX }}
      SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
      HEE_FROM_EMAIL: ${{ vars.PRODUCTION_HEE_FROM_EMAIL }}
      MOYASAR_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_MOYASAR_PUBLISHABLE_KEY }}
      MOYASAR_SECRET_KEY: ${{ secrets.PRODUCTION_MOYASAR_SECRET_KEY }}
      MOYASAR_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_MOYASAR_WEBHOOK_SECRET }}
      BILLING_TOKEN_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BILLING_TOKEN_ENCRYPTION_KEY }}
      BILLING_SELLER_LEGAL_NAME_AR: ${{ vars.PRODUCTION_BILLING_SELLER_LEGAL_NAME_AR }}
      BILLING_SELLER_ADDRESS_AR: ${{ vars.PRODUCTION_BILLING_SELLER_ADDRESS_AR }}
      BILLING_TAX_STATUS: ${{ vars.PRODUCTION_BILLING_TAX_STATUS }}
      BILLING_RENEWAL_ENABLED: ${{ vars.PRODUCTION_BILLING_RENEWAL_ENABLED }}
      BILLING_OPERATIONS_READY: ${{ vars.PRODUCTION_BILLING_OPERATIONS_READY }}
      PAID_CHECKOUT_PUBLIC_ENABLED: ${{ vars.PRODUCTION_PAID_CHECKOUT_PUBLIC_ENABLED }}
      BILLING_REHEARSAL_USER_EMAIL: ${{ vars.PRODUCTION_BILLING_REHEARSAL_USER_EMAIL }}
      STORAGE_DRIVER: ${{ vars.PRODUCTION_STORAGE_DRIVER }}
      S3_ENDPOINT: ${{ vars.PRODUCTION_S3_ENDPOINT }}
      S3_REGION: ${{ vars.PRODUCTION_S3_REGION }}
      S3_BUCKET: ${{ vars.PRODUCTION_S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_S3_SECRET_ACCESS_KEY }}
      S3_FORCE_PATH_STYLE: ${{ vars.PRODUCTION_S3_FORCE_PATH_STYLE }}
      GOOGLE_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET }}
      APPLE_CLIENT_ID: ${{ secrets.PRODUCTION_APPLE_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ secrets.PRODUCTION_APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.PRODUCTION_APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.PRODUCTION_APPLE_PRIVATE_KEY }}

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require green RC Quality and Production Preflight for exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/rc-quality.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "hee-v6-rc")] | length')"
          preflight_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/production-preflight.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "hee-v6-rc")] | length')"
          test "$rc_runs" -ge 1 || (echo "Exact release SHA has no green RC Quality push run on hee-v6-rc" && exit 1)
          test "$preflight_runs" -ge 1 || (echo "Exact release SHA has no green Production Preflight run" && exit 1)

      - name: Verify deployment credential and project identity
        working-directory: .
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || (echo "PRODUCTION_VERCEL_TOKEN is not configured" && exit 1)
          project_json="$(curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (String(body.id ?? "") !== process.env.VERCEL_PROJECT_ID) throw new Error("Unexpected Vercel project");
            if (String(body.accountId ?? "") !== process.env.VERCEL_ORG_ID) throw new Error("Unexpected Vercel team");
          ' "$project_json"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify production schema is already migrated
        run: npx prisma migrate status

      - name: Sync reviewed GitHub production environment to Vercel Production
        working-directory: .
        env:
          APP_ENV: production
          APP_URL: https://hee.sa
          AUTH_ORIGIN: https://hee.sa
          NEXT_PUBLIC_APP_URL: https://hee.sa
          API_URL: https://hee.sa
          PAYMENT_PROVIDER: moyasar
          S3_ALLOW_INSECURE: "false"
        run: |
          set -euo pipefail
          node - <<'NODE'
          const required = (name) => {
            const value = String(process.env[name] ?? "").trim();
            if (!value) throw new Error(`${name} is required before production environment sync`);
            return value;
          };

          required("VERCEL_TOKEN");
          required("DATABASE_URL");
          required("PG_POOL_MAX");
          required("SESSION_SECRET");
          required("RESEND_API_KEY");
          required("HEE_FROM_EMAIL");
          required("MOYASAR_PUBLISHABLE_KEY");
          required("MOYASAR_SECRET_KEY");
          required("MOYASAR_WEBHOOK_SECRET");
          required("BILLING_TOKEN_ENCRYPTION_KEY");
          required("BILLING_SELLER_LEGAL_NAME_AR");
          required("BILLING_SELLER_ADDRESS_AR");
          required("BILLING_TAX_STATUS");
          required("BILLING_RENEWAL_ENABLED");
          required("BILLING_OPERATIONS_READY");
          required("PAID_CHECKOUT_PUBLIC_ENABLED");
          required("STORAGE_DRIVER");

          const plainKeys = [
            "APP_ENV", "APP_URL", "AUTH_ORIGIN", "NEXT_PUBLIC_APP_URL", "API_URL",
            "PG_POOL_MAX", "HEE_FROM_EMAIL", "PAYMENT_PROVIDER",
            "BILLING_SELLER_LEGAL_NAME_AR", "BILLING_SELLER_ADDRESS_AR", "BILLING_TAX_STATUS",
            "BILLING_RENEWAL_ENABLED", "BILLING_OPERATIONS_READY", "PAID_CHECKOUT_PUBLIC_ENABLED",
            "BILLING_REHEARSAL_USER_EMAIL", "STORAGE_DRIVER", "S3_ENDPOINT", "S3_REGION", "S3_BUCKET",
            "S3_FORCE_PATH_STYLE", "S3_ALLOW_INSECURE",
          ];
          const sensitiveKeys = [
            "DATABASE_URL", "SESSION_SECRET", "RESEND_API_KEY",
            "MOYASAR_PUBLISHABLE_KEY", "MOYASAR_SECRET_KEY", "MOYASAR_WEBHOOK_SECRET",
            "BILLING_TOKEN_ENCRYPTION_KEY", "S3_ACCESS_KEY_ID", "S3_SECRET_ACCESS_KEY",
            "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "APPLE_CLIENT_ID", "APPLE_TEAM_ID",
            "APPLE_KEY_ID", "APPLE_PRIVATE_KEY",
          ];

          const entries = [
            ...plainKeys.map((key) => ({ key, value: String(process.env[key] ?? ""), type: "plain", target: ["production"] })),
            ...sensitiveKeys.map((key) => ({ key, value: String(process.env[key] ?? ""), type: "sensitive", target: ["production"] })),
            { key: "QA_AUDIT_SECRET", value: "", type: "sensitive", target: ["production"] },
            { key: "QA_AUDIT_USER_EMAIL", value: "", type: "plain", target: ["production"] },
          ];

          const response = await fetch(
            `https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env?upsert=true&teamId=${process.env.VERCEL_ORG_ID}`,
            {
              method: "POST",
              headers: {
                authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
                "content-type": "application/json",
              },
              body: JSON.stringify(entries),
            },
          );
          if (!response.ok) throw new Error(`Vercel production environment sync failed with HTTP ${response.status}`);
          const result = await response.json();
          if (Array.isArray(result?.failed) && result.failed.length) {
            throw new Error(`Vercel production environment sync reported ${result.failed.length} failed entries`);
          }
          console.log(`vercel-production-env-sync: PASS (${entries.length} keys, values not logged)`);
          NODE

      - name: Deploy exact checkout as a fresh Production build
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_REF: hee-v6-rc
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")"
          test -n "$deployment_url" || (echo "Vercel did not return a production deployment URL" && exit 1)
          printf '%s' "$deployment_url" > /tmp/hee-production-deployment-url

      - name: Verify canonical domain serves exact release SHA
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if release_json="$(curl --silent --show-error --fail --max-time 10 https://hee.sa/api/release 2>/dev/null)"; then
              release_sha="$(node -e 'const body=JSON.parse(process.argv[1]); process.stdout.write(String(body.releaseSha ?? ""));' "$release_json")"
              release_env="$(node -e 'const body=JSON.parse(process.argv[1]); process.stdout.write(String(body.environment ?? ""));' "$release_json")"
              if [ "$release_sha" = "$GITHUB_SHA" ] && [ "$release_env" = "production" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "hee.sa did not converge to exact production release ${GITHUB_SHA}"
          exit 1

      - name: Verify baseline customer surfaces after production deploy
        working-directory: .
        run: |
          set -euo pipefail
          for path in / /register /login /terms /privacy /contact /demo; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 "https://hee.sa${path}")"
            case "$code" in
              200|301|302|303|307|308) ;;
              *) echo "Production surface ${path} returned HTTP ${code}"; exit 1 ;;
            esac
          done

      - name: Deployment summary
        working-directory: .
        run: |
          echo "production-web-deploy: PASS for ${GITHUB_SHA}"
          echo "Deployment URL: $(cat /tmp/hee-production-deployment-url)"
