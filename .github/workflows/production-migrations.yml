name: Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_PRODUCTION_MIGRATIONS to continue"
        required: true
        type: string

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY_PRODUCTION_MIGRATIONS' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify production database secret
        run: test -n "$DATABASE_URL" || (echo "PRODUCTION_DATABASE_URL is not configured" && exit 1)
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Show migration status before deploy
        run: npx prisma migrate status
      - name: Apply pending migrations
        run: npx prisma migrate deploy
      - name: Verify migration status after deploy
        run: npx prisma migrate status
