name: Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_PRODUCTION_MIGRATIONS to continue"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY_PRODUCTION_MIGRATIONS' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_BACKUP_PASSPHRASE: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify production database and backup secrets
        run: |
          test -n "$DATABASE_URL" || (echo "PRODUCTION_DATABASE_URL is not configured" && exit 1)
          test -n "$PRODUCTION_BACKUP_PASSPHRASE" || (echo "PRODUCTION_BACKUP_PASSPHRASE is not configured" && exit 1)
          node -e 'const u=new URL(process.env.DATABASE_URL); const h=u.hostname.toLowerCase(); const d=u.pathname.replace(/^\//,""); if(["localhost","127.0.0.1","::1"].includes(h)||d==="hee_ci"||d==="hee_restore") { console.error("Refusing non-production database target"); process.exit(1) }'
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Show migration status before deploy
        run: npx prisma migrate status
      - name: Create encrypted pre-migration backup
        run: |
          pg_dump "$DATABASE_URL" --format=custom --file=/tmp/hee-production-pre-migration.dump
          test -s /tmp/hee-production-pre-migration.dump
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/hee-production-pre-migration.dump \
            -out /tmp/hee-production-pre-migration.dump.enc \
            -pass env:PRODUCTION_BACKUP_PASSPHRASE
          rm -f /tmp/hee-production-pre-migration.dump
      - name: Preserve encrypted recovery backup
        uses: actions/upload-artifact@v4
        with:
          name: hee-production-pre-migration-${{ github.sha }}
          path: /tmp/hee-production-pre-migration.dump.enc
          if-no-files-found: error
          retention-days: 3
      - name: Apply pending migrations
        run: npx prisma migrate deploy
      - name: Verify migration status after deploy
        run: npx prisma migrate status
      - name: Remove local encrypted backup copy
        if: always()
        run: rm -f /tmp/hee-production-pre-migration.dump.enc
