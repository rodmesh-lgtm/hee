name: Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_PRODUCTION_MIGRATIONS to continue"
        required: true
        type: string
      writes_paused_confirmation:
        description: "After verified maintenance is active, type PRODUCTION_WRITES_PAUSED"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY_PRODUCTION_MIGRATIONS' && inputs.writes_paused_confirmation == 'PRODUCTION_WRITES_PAUSED' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RESTORE_DATABASE_URL: ${{ secrets.PRODUCTION_RESTORE_DATABASE_URL }}
      EXPECTED_PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PRODUCTION_BACKUP_PASSPHRASE: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE }}
      HETZNER_HOST: ${{ vars.PRODUCTION_HETZNER_HOST }}
      HETZNER_USER: ${{ vars.PRODUCTION_HETZNER_USER }}
      HETZNER_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_HETZNER_SSH_PRIVATE_KEY }}
      HETZNER_KNOWN_HOSTS: ${{ secrets.PRODUCTION_HETZNER_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7

      - name: Canonicalize verified Production database URLs before release attestation
        run: node ../../.github/scripts/require-production-database-safety.mjs DATABASE_URL RESTORE_DATABASE_URL

      - name: Require content-proven RC Quality for release
        uses: ./.github/actions/require-release-quality
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require successful Production Preflight V2 for exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          preflight_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/production-preflight-v2.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "hee-v6-rc")] | length')"
          if [ "$preflight_runs" -lt 1 ]; then
            echo "Refusing production migration: exact release SHA ${GITHUB_SHA} has no successful Production Preflight V2 run."
            exit 1
          fi

      - name: Require successful exact-SHA maintenance entry workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          maintenance_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/production-enter-maintenance.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "hee-v6-rc")] | length')"
          test "$maintenance_runs" -ge 1 || (echo "Refusing production migration: exact release SHA has no successful Production Enter Maintenance run" && exit 1)

      - name: Prove canonical web is still exact-SHA maintenance before any database access
        working-directory: .
        run: |
          set -euo pipefail
          status_json="$(curl --silent --show-error --fail --max-time 20 https://ir.sa/api/maintenance/status)"
          maintenance="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.maintenance===true));' "$status_json")"
          release_sha="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.releaseSha??""));' "$status_json")"
          release_env="$(node -e 'const b=JSON.parse(process.argv[1]);process.stdout.write(String(b.environment??""));' "$status_json")"
          test "$maintenance" = "true" || (echo "Canonical web is no longer in maintenance" && exit 1)
          test "$release_sha" = "$GITHUB_SHA" || (echo "Canonical maintenance SHA differs from migration SHA" && exit 1)
          test "$release_env" = "production" || (echo "Canonical maintenance endpoint is not production" && exit 1)
          code="$(curl --silent --show-error --output /tmp/hee-migration-maintenance.html --write-out '%{http_code}' --max-time 20 https://ir.sa/)"
          test "$code" = "503" || (echo "Canonical customer traffic is not blocked (HTTP ${code})" && exit 1)
          grep -q 'صيانة مجدولة' /tmp/hee-migration-maintenance.html || (echo "Canonical maintenance response body is missing" && exit 1)

      - name: Configure pinned Hetzner SSH verification
        working-directory: .
        run: |
          set -euo pipefail
          test -n "$HETZNER_HOST" || (echo "PRODUCTION_HETZNER_HOST is not configured" && exit 1)
          test -n "$HETZNER_USER" || (echo "PRODUCTION_HETZNER_USER is not configured" && exit 1)
          test -n "$HETZNER_SSH_PRIVATE_KEY" || (echo "PRODUCTION_HETZNER_SSH_PRIVATE_KEY is not configured" && exit 1)
          test -n "$HETZNER_KNOWN_HOSTS" || (echo "PRODUCTION_HETZNER_KNOWN_HOSTS is not configured" && exit 1)
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hee-production"
          chmod 0600 "$HOME/.ssh/hee-production"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Prove billing worker maintenance lock and quiescence
        working-directory: .
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hee-production" -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /etc/hee/maintenance.lock || { echo 'Hetzner maintenance lock is missing'; exit 1; }
          grep -qx 'ConditionPathExists=!/etc/hee/maintenance.lock' /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf || { echo 'systemd maintenance condition is missing'; exit 1; }
          if sudo -n systemctl is-active --quiet hee-billing-renew.timer; then echo 'Billing timer is active'; exit 1; fi
          if sudo -n systemctl is-active --quiet hee-billing-renew.service; then echo 'Billing service is active'; exit 1; fi
          if sudo -n systemctl is-active --quiet hee-whatsapp-operations.timer; then echo 'WhatsApp timer is active'; exit 1; fi
          if sudo -n systemctl is-active --quiet hee-whatsapp-operations.service; then echo 'WhatsApp service is active'; exit 1; fi
          REMOTE

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Require verify-full PostgreSQL transport before migration tooling
        run: node ../../.github/scripts/require-production-database-safety.mjs DATABASE_URL RESTORE_DATABASE_URL

      - name: Verify production, restore and backup secrets
        run: |
          test -n "$DATABASE_URL" || (echo "PRODUCTION_DATABASE_URL is not configured" && exit 1)
          test -n "$RESTORE_DATABASE_URL" || (echo "PRODUCTION_RESTORE_DATABASE_URL is not configured" && exit 1)
          test -n "$PRODUCTION_BACKUP_PASSPHRASE" || (echo "PRODUCTION_BACKUP_PASSPHRASE is not configured" && exit 1)
          test "${#PRODUCTION_BACKUP_PASSPHRASE}" -ge 32 || (echo "PRODUCTION_BACKUP_PASSPHRASE must be at least 32 characters" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Show migration status before deploy
        run: npx prisma migrate status

      - name: Re-prove maintenance immediately before taking production backup
        working-directory: .
        run: |
          set -euo pipefail
          status_json="$(curl --silent --show-error --fail --max-time 20 https://ir.sa/api/maintenance/status)"
          node -e 'const b=JSON.parse(process.argv[1]);if(b.maintenance!==true||b.releaseSha!==process.env.GITHUB_SHA||b.environment!=="production")process.exit(1);' "$status_json"
          ssh -i "$HOME/.ssh/hee-production" -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
            "test -f /etc/hee/maintenance.lock && ! sudo -n systemctl is-active --quiet hee-billing-renew.timer && ! sudo -n systemctl is-active --quiet hee-billing-renew.service"

      - name: Create encrypted pre-migration backup
        run: |
          pg_dump "$DATABASE_URL" --format=custom --file=/tmp/hee-production-pre-migration.dump
          test -s /tmp/hee-production-pre-migration.dump
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/hee-production-pre-migration.dump \
            -out /tmp/hee-production-pre-migration.dump.enc \
            -pass env:PRODUCTION_BACKUP_PASSPHRASE
          test -s /tmp/hee-production-pre-migration.dump.enc

      - name: Verify encrypted backup can be decrypted and parsed
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/hee-production-pre-migration.dump.enc \
            -out /tmp/hee-production-backup-verify.dump \
            -pass env:PRODUCTION_BACKUP_PASSPHRASE
          test -s /tmp/hee-production-backup-verify.dump
          pg_restore --list /tmp/hee-production-backup-verify.dump >/dev/null

      - name: Reset isolated restore schema
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'

      - name: Restore exact pre-migration backup into isolated database
        run: pg_restore --exit-on-error --dbname="$RESTORE_DATABASE_URL" --no-owner --no-privileges /tmp/hee-production-backup-verify.dump

      - name: Prove restored critical data matches technically paused production source
        env:
          SOURCE_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.PRODUCTION_RESTORE_DATABASE_URL }}
        run: npm run backup:production-proof

      - name: Capture pre-migration critical data fingerprint
        run: npm run migration:production-data-proof -- --capture /tmp/hee-production-pre-migration-proof.json

      - name: Preserve encrypted recovery backup
        uses: actions/upload-artifact@v4
        with:
          name: hee-production-pre-migration-${{ github.sha }}
          path: /tmp/hee-production-pre-migration.dump.enc
          if-no-files-found: error
          retention-days: 14

      - name: Apply pending migrations
        run: npx prisma migrate deploy

      - name: Verify migration status after deploy
        run: npx prisma migrate status

      - name: Prove critical data unchanged after deploy
        run: npm run migration:production-data-proof -- --verify /tmp/hee-production-pre-migration-proof.json

      - name: Prove maintenance remains active after migration
        working-directory: .
        run: |
          set -euo pipefail
          status_json="$(curl --silent --show-error --fail --max-time 20 https://ir.sa/api/maintenance/status)"
          node -e 'const b=JSON.parse(process.argv[1]);if(b.maintenance!==true||b.releaseSha!==process.env.GITHUB_SHA||b.environment!=="production")process.exit(1);' "$status_json"
          ssh -i "$HOME/.ssh/hee-production" -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
            "test -f /etc/hee/maintenance.lock && ! sudo -n systemctl is-active --quiet hee-billing-renew.timer && ! sudo -n systemctl is-active --quiet hee-billing-renew.service"
          echo "production-migrations: PASS for ${GITHUB_SHA}; maintenance intentionally remains active until exact release deployment"

      - name: Remove runner-local backup and SSH material
        if: always()
        working-directory: .
        run: rm -f /tmp/hee-production-pre-migration.dump /tmp/hee-production-pre-migration.dump.enc /tmp/hee-production-backup-verify.dump /tmp/hee-production-pre-migration-proof.json /tmp/hee-migration-maintenance.html "$HOME/.ssh/hee-production" "$HOME/.ssh/known_hosts"
