name: Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_PRODUCTION_MIGRATIONS to continue"
        required: true
        type: string
      writes_paused_confirmation:
        description: "After web/workers are stopped, type PRODUCTION_WRITES_PAUSED"
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Shares the restore database with the scheduled backup proof. Serializing both
# workflows prevents one job from cleaning the restore target under the other.
concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY_PRODUCTION_MIGRATIONS' && inputs.writes_paused_confirmation == 'PRODUCTION_WRITES_PAUSED' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RESTORE_DATABASE_URL: ${{ secrets.PRODUCTION_RESTORE_DATABASE_URL }}
      PRODUCTION_BACKUP_PASSPHRASE: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7
      - name: Require green RC Quality for exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/rc-quality.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "hee-v6-rc")] | length')"
          if [ "$successful_runs" -lt 1 ]; then
            echo "Refusing production migration: exact release SHA ${GITHUB_SHA} has no successful RC Quality push run on hee-v6-rc."
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify production, restore and backup secrets
        run: |
          test -n "$DATABASE_URL" || (echo "PRODUCTION_DATABASE_URL is not configured" && exit 1)
          test -n "$RESTORE_DATABASE_URL" || (echo "PRODUCTION_RESTORE_DATABASE_URL is not configured" && exit 1)
          test -n "$PRODUCTION_BACKUP_PASSPHRASE" || (echo "PRODUCTION_BACKUP_PASSPHRASE is not configured" && exit 1)
          node - <<'NODE'
          const source = new URL(process.env.DATABASE_URL);
          const restore = new URL(process.env.RESTORE_DATABASE_URL);
          const sourceDb = source.pathname.replace(/^\//, "");
          const restoreDb = restore.pathname.replace(/^\//, "");
          if (["localhost","127.0.0.1","::1"].includes(source.hostname.toLowerCase()) || /^(hee_ci|hee_restore(?:_|$))/i.test(sourceDb)) throw new Error("Refusing non-production source database target");
          if (source.href === restore.href) throw new Error("Restore target must never equal production");
          if (!/^hee_restore(?:_|$)/i.test(restoreDb)) throw new Error("Restore database name must begin with hee_restore");
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Show migration status before deploy
        run: npx prisma migrate status
      - name: Create encrypted pre-migration backup
        run: |
          pg_dump "$DATABASE_URL" --format=custom --file=/tmp/hee-production-pre-migration.dump
          test -s /tmp/hee-production-pre-migration.dump
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/hee-production-pre-migration.dump \
            -out /tmp/hee-production-pre-migration.dump.enc \
            -pass env:PRODUCTION_BACKUP_PASSPHRASE
          test -s /tmp/hee-production-pre-migration.dump.enc
      - name: Verify encrypted backup can be decrypted and parsed
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/hee-production-pre-migration.dump.enc \
            -out /tmp/hee-production-backup-verify.dump \
            -pass env:PRODUCTION_BACKUP_PASSPHRASE
          test -s /tmp/hee-production-backup-verify.dump
          pg_restore --list /tmp/hee-production-backup-verify.dump >/dev/null
      - name: Reset isolated restore schema
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
      - name: Restore exact pre-migration backup into isolated database
        run: pg_restore --exit-on-error --dbname="$RESTORE_DATABASE_URL" --no-owner --no-privileges /tmp/hee-production-backup-verify.dump
      - name: Prove restored critical data matches paused production source
        env:
          SOURCE_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.PRODUCTION_RESTORE_DATABASE_URL }}
        run: npm run backup:production-proof
      - name: Capture pre-migration critical data fingerprint
        run: npm run migration:production-data-proof -- --capture /tmp/hee-production-pre-migration-proof.json
      - name: Preserve encrypted recovery backup
        uses: actions/upload-artifact@v4
        with:
          name: hee-production-pre-migration-${{ github.sha }}
          path: /tmp/hee-production-pre-migration.dump.enc
          if-no-files-found: error
          retention-days: 14
      - name: Apply pending migrations
        run: npx prisma migrate deploy
      - name: Verify migration status after deploy
        run: npx prisma migrate status
      - name: Prove critical data unchanged after deploy
        run: npm run migration:production-data-proof -- --verify /tmp/hee-production-pre-migration-proof.json
      - name: Remove local backup copies
        if: always()
        run: rm -f /tmp/hee-production-pre-migration.dump /tmp/hee-production-pre-migration.dump.enc /tmp/hee-production-backup-verify.dump /tmp/hee-production-pre-migration-proof.json
