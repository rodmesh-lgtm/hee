name: Round 131 Finalize Web Cutover

on:
  push:
    branches:
      - round-131-web-cutover-billing-decoupling
    paths:
      - .github/workflows/round-131-apply.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: round-131-web-cutover-billing-decoupling
          fetch-depth: 1
      - name: Patch preflight and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/production-preflight-v2.yml')
          s = p.read_text()
          old = """          if (!required('MOYASAR_PUBLISHABLE_KEY').startsWith('pk_live_')) throw new Error('Moyasar publishable key must be live');
          if (!required('MOYASAR_SECRET_KEY').startsWith('sk_live_')) throw new Error('Moyasar secret key must be live');
          if (required('MOYASAR_WEBHOOK_SECRET').length < 24) throw new Error('MOYASAR_WEBHOOK_SECRET is too short');
          const encoded = required('BILLING_TOKEN_ENCRYPTION_KEY');
          const raw = Buffer.from(encoded, 'base64');
          if (raw.length !== 32 || raw.toString('base64') !== encoded) throw new Error('BILLING_TOKEN_ENCRYPTION_KEY must be canonical base64 for 32 bytes');
          required('BILLING_SELLER_LEGAL_NAME_AR');
          required('BILLING_SELLER_ADDRESS_AR');
          if (required('BILLING_TAX_STATUS').toLowerCase() !== 'not_registered') throw new Error('Paid launch is blocked until the configured seller tax posture is supported');
          const billingRenewalEnabled = booleanValue('BILLING_RENEWAL_ENABLED') === 'true';
          const billingOperationsReady = booleanValue('BILLING_OPERATIONS_READY') === 'true';
"""
          new = """          const encoded = required('BILLING_TOKEN_ENCRYPTION_KEY');
          const raw = Buffer.from(encoded, 'base64');
          if (raw.length !== 32 || raw.toString('base64') !== encoded) throw new Error('BILLING_TOKEN_ENCRYPTION_KEY must be canonical base64 for 32 bytes');
          const billingRenewalEnabled = booleanValue('BILLING_RENEWAL_ENABLED') === 'true';
          const billingOperationsReady = booleanValue('BILLING_OPERATIONS_READY') === 'true';
          const billingRequired = billingRenewalEnabled || billingOperationsReady;
          if (billingRequired) {
            if (!required('MOYASAR_PUBLISHABLE_KEY').startsWith('pk_live_')) throw new Error('Moyasar publishable key must be live');
            if (!required('MOYASAR_SECRET_KEY').startsWith('sk_live_')) throw new Error('Moyasar secret key must be live');
            if (required('MOYASAR_WEBHOOK_SECRET').length < 24) throw new Error('MOYASAR_WEBHOOK_SECRET is too short');
            required('BILLING_SELLER_LEGAL_NAME_AR');
            required('BILLING_SELLER_ADDRESS_AR');
            if (required('BILLING_TAX_STATUS').toLowerCase() !== 'not_registered') throw new Error('Paid launch is blocked until the configured seller tax posture is supported');
          }
"""
          if old not in s:
              raise SystemExit('billing validation block missing')
          s = s.replace(old, new, 1)
          marker = "      - name: Verify Moyasar live secret credential read-only\n        run: |\n"
          expr = '$' + '{{' + " vars.PRODUCTION_BILLING_RENEWAL_ENABLED == 'true' || vars.PRODUCTION_BILLING_OPERATIONS_READY == 'true' " + '}}'
          repl = "      - name: Verify Moyasar live secret credential read-only\n        if: " + expr + "\n        run: |\n"
          if marker not in s:
              raise SystemExit('Moyasar probe marker missing')
          p.write_text(s.replace(marker, repl, 1))

          t = Path('apps/web/tests/production-web-only-preflight-source-guards.test.ts')
          t.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\nimport { spawnSync } from "node:child_process";\nimport test from "node:test";\n\nconst root = resolve(process.cwd(), "../..");\nconst auditPath = resolve(root, ".github/scripts/production-config-presence-audit.mjs");\nconst preflight = readFileSync(resolve(root, ".github/workflows/production-preflight-v2.yml"), "utf8");\nconst paid = readFileSync(resolve(root, ".github/workflows/production-open-paid-checkout.yml"), "utf8");\n\nfunction webOnlyEnv() { return { ...process.env, DATABASE_URL: "present", RESTORE_DATABASE_URL: "present", PRODUCTION_BACKUP_PASSPHRASE: "present", SESSION_SECRET: "present", RESEND_API_KEY: "present", BILLING_TOKEN_ENCRYPTION_KEY: "present", VERCEL_TOKEN: "present", PG_POOL_MAX: "2", HEE_FROM_EMAIL: "HEE <noreply@ir.sa>", BILLING_RENEWAL_ENABLED: "false", BILLING_OPERATIONS_READY: "false", PAID_CHECKOUT_PUBLIC_ENABLED: "false", STORAGE_DRIVER: "database", MOYASAR_PUBLISHABLE_KEY: "", MOYASAR_SECRET_KEY: "", MOYASAR_WEBHOOK_SECRET: "", BILLING_SELLER_LEGAL_NAME_AR: "", BILLING_SELLER_ADDRESS_AR: "", BILLING_TAX_STATUS: "", HETZNER_HOST: "", HETZNER_USER: "", HETZNER_SSH_PRIVATE_KEY: "", HETZNER_KNOWN_HOSTS: "" }; }\n\ntest("web-only Production presence defers billing provider and worker config", () => { const r = spawnSync(process.execPath, [auditPath], { env: webOnlyEnv(), encoding: "utf8" }); assert.equal(r.status, 0, r.stderr); });\ntest("billing operations restore fail-closed requirements", () => { const r = spawnSync(process.execPath, [auditPath], { env: { ...webOnlyEnv(), BILLING_OPERATIONS_READY: "true" }, encoding: "utf8" }); assert.notEqual(r.status, 0); for (const n of ["MOYASAR_PUBLISHABLE_KEY","MOYASAR_SECRET_KEY","MOYASAR_WEBHOOK_SECRET","BILLING_SELLER_LEGAL_NAME_AR","BILLING_SELLER_ADDRESS_AR","BILLING_TAX_STATUS","HETZNER_HOST","HETZNER_USER","HETZNER_SSH_PRIVATE_KEY","HETZNER_KNOWN_HOSTS"]) assert.match(r.stderr, new RegExp(n)); });\ntest("Moyasar probe is conditional", () => { const a = preflight.indexOf("Verify Moyasar live secret credential read-only"); const b = preflight.indexOf("Verify Hetzner worker rollback baseline", a); const x = preflight.slice(a,b); assert.match(x,/PRODUCTION_BILLING_RENEWAL_ENABLED/); assert.match(x,/PRODUCTION_BILLING_OPERATIONS_READY/); assert.match(preflight,/const billingRequired = billingRenewalEnabled \\|\\| billingOperationsReady/); });\ntest("paid checkout summary uses YAML block scalar", () => { const x = paid.slice(paid.indexOf("Public paid launch summary")); assert.match(x,/run: \\|\\n\\s+echo "production-open-paid-checkout: PASS/); });\n''')
          PY
          git rm .github/workflows/round-131-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/production-preflight-v2.yml apps/web/tests/production-web-only-preflight-source-guards.test.ts
          git commit -m "fix(round-131): finish web-only preflight decoupling"
          git push origin HEAD:round-131-web-cutover-billing-decoupling
