name: Round 131 Apply Web Cutover Decoupling

on:
  push:
    branches: [round-131-web-cutover-billing-decoupling]
    paths:
      - ".github/workflows/round-131-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: round-131-web-cutover-billing-decoupling
          fetch-depth: 1
      - name: Apply exact guarded patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          audit = Path('.github/scripts/production-config-presence-audit.mjs')
          text = audit.read_text()
          for line in [
              "  'MOYASAR_PUBLISHABLE_KEY',\n", "  'MOYASAR_SECRET_KEY',\n", "  'MOYASAR_WEBHOOK_SECRET',\n",
              "  'BILLING_SELLER_LEGAL_NAME_AR',\n", "  'BILLING_SELLER_ADDRESS_AR',\n", "  'BILLING_TAX_STATUS',\n",
          ]:
              if line not in text:
                  raise SystemExit(f'presence list line missing: {line!r}')
              text = text.replace(line, '', 1)
          old = """  const workerRequired = ['BILLING_RENEWAL_ENABLED', 'BILLING_OPERATIONS_READY']
    .some((name) => value(name).toLowerCase() === 'true');
  if (workerRequired) {
    for (const name of ['HETZNER_HOST', 'HETZNER_USER', 'HETZNER_SSH_PRIVATE_KEY', 'HETZNER_KNOWN_HOSTS']) {
      if (!value(name)) missing.push(name);
    }
  }
"""
          new = """  const billingRequired = ['BILLING_RENEWAL_ENABLED', 'BILLING_OPERATIONS_READY']
    .some((name) => value(name).toLowerCase() === 'true');
  if (billingRequired) {
    for (const name of [
      'MOYASAR_PUBLISHABLE_KEY', 'MOYASAR_SECRET_KEY', 'MOYASAR_WEBHOOK_SECRET',
      'BILLING_SELLER_LEGAL_NAME_AR', 'BILLING_SELLER_ADDRESS_AR', 'BILLING_TAX_STATUS',
      'HETZNER_HOST', 'HETZNER_USER', 'HETZNER_SSH_PRIVATE_KEY', 'HETZNER_KNOWN_HOSTS',
    ]) {
      if (!value(name)) missing.push(name);
    }
  }
"""
          if old not in text:
              raise SystemExit('worker presence block missing')
          audit.write_text(text.replace(old, new, 1))

          preflight = Path('.github/workflows/production-preflight-v2.yml')
          text = preflight.read_text()
          old = """          if (!required('MOYASAR_PUBLISHABLE_KEY').startsWith('pk_live_')) throw new Error('Moyasar publishable key must be live');
          if (!required('MOYASAR_SECRET_KEY').startsWith('sk_live_')) throw new Error('Moyasar secret key must be live');
          if (required('MOYASAR_WEBHOOK_SECRET').length < 24) throw new Error('MOYASAR_WEBHOOK_SECRET is too short');
          const encoded = required('BILLING_TOKEN_ENCRYPTION_KEY');
          const raw = Buffer.from(encoded, 'base64');
          if (raw.length !== 32 || raw.toString('base64') !== encoded) throw new Error('BILLING_TOKEN_ENCRYPTION_KEY must be canonical base64 for 32 bytes');
          required('BILLING_SELLER_LEGAL_NAME_AR');
          required('BILLING_SELLER_ADDRESS_AR');
          if (required('BILLING_TAX_STATUS').toLowerCase() !== 'not_registered') throw new Error('Paid launch is blocked until the configured seller tax posture is supported');
          const billingRenewalEnabled = booleanValue('BILLING_RENEWAL_ENABLED') === 'true';
          const billingOperationsReady = booleanValue('BILLING_OPERATIONS_READY') === 'true';
"""
          new = """          const encoded = required('BILLING_TOKEN_ENCRYPTION_KEY');
          const raw = Buffer.from(encoded, 'base64');
          if (raw.length !== 32 || raw.toString('base64') !== encoded) throw new Error('BILLING_TOKEN_ENCRYPTION_KEY must be canonical base64 for 32 bytes');
          const billingRenewalEnabled = booleanValue('BILLING_RENEWAL_ENABLED') === 'true';
          const billingOperationsReady = booleanValue('BILLING_OPERATIONS_READY') === 'true';
          const billingRequired = billingRenewalEnabled || billingOperationsReady;
          if (billingRequired) {
            if (!required('MOYASAR_PUBLISHABLE_KEY').startsWith('pk_live_')) throw new Error('Moyasar publishable key must be live');
            if (!required('MOYASAR_SECRET_KEY').startsWith('sk_live_')) throw new Error('Moyasar secret key must be live');
            if (required('MOYASAR_WEBHOOK_SECRET').length < 24) throw new Error('MOYASAR_WEBHOOK_SECRET is too short');
            required('BILLING_SELLER_LEGAL_NAME_AR');
            required('BILLING_SELLER_ADDRESS_AR');
            if (required('BILLING_TAX_STATUS').toLowerCase() !== 'not_registered') throw new Error('Paid launch is blocked until the configured seller tax posture is supported');
          }
"""
          if old not in text:
              raise SystemExit('preflight billing validation block missing')
          text = text.replace(old, new, 1)
          marker = "      - name: Verify Moyasar live secret credential read-only\n        run: |\n"
          condition = "        if: $" + "{{ vars.PRODUCTION_BILLING_RENEWAL_ENABLED == 'true' || vars.PRODUCTION_BILLING_OPERATIONS_READY == 'true' }}\n"
          if marker not in text:
              raise SystemExit('Moyasar probe step missing')
          preflight.write_text(text.replace(marker, "      - name: Verify Moyasar live secret credential read-only\n" + condition + "        run: |\n", 1))

          paid = Path('.github/workflows/production-open-paid-checkout.yml')
          lines = paid.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.strip().startswith('run: echo "production-open-paid-checkout: PASS'):
                  payload = line.split('run: ', 1)[1]
                  lines[i] = '        run: |'
                  lines.insert(i + 1, '          ' + payload)
                  break
          else:
              raise SystemExit('paid summary inline run missing')
          paid.write_text('\n'.join(lines) + '\n')

          test_path = Path('apps/web/tests/production-web-only-preflight-source-guards.test.ts')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\nimport { spawnSync } from "node:child_process";\nimport test from "node:test";\n\nconst root = resolve(process.cwd(), "../..");\nconst auditPath = resolve(root, ".github/scripts/production-config-presence-audit.mjs");\nconst preflight = readFileSync(resolve(root, ".github/workflows/production-preflight-v2.yml"), "utf8");\nconst paid = readFileSync(resolve(root, ".github/workflows/production-open-paid-checkout.yml"), "utf8");\n\nfunction webOnlyEnv() {\n  return { ...process.env, DATABASE_URL: "present", RESTORE_DATABASE_URL: "present", PRODUCTION_BACKUP_PASSPHRASE: "present", SESSION_SECRET: "present", RESEND_API_KEY: "present", BILLING_TOKEN_ENCRYPTION_KEY: "present", VERCEL_TOKEN: "present", PG_POOL_MAX: "2", HEE_FROM_EMAIL: "HEE <noreply@ir.sa>", BILLING_RENEWAL_ENABLED: "false", BILLING_OPERATIONS_READY: "false", PAID_CHECKOUT_PUBLIC_ENABLED: "false", STORAGE_DRIVER: "database", MOYASAR_PUBLISHABLE_KEY: "", MOYASAR_SECRET_KEY: "", MOYASAR_WEBHOOK_SECRET: "", BILLING_SELLER_LEGAL_NAME_AR: "", BILLING_SELLER_ADDRESS_AR: "", BILLING_TAX_STATUS: "", HETZNER_HOST: "", HETZNER_USER: "", HETZNER_SSH_PRIVATE_KEY: "", HETZNER_KNOWN_HOSTS: "" };\n}\n\ntest("web-only Production presence defers provider, seller and worker config", () => {\n  const run = spawnSync(process.execPath, [auditPath], { env: webOnlyEnv(), encoding: "utf8" });\n  assert.equal(run.status, 0, run.stderr);\n  assert.match(run.stdout, /production-config-presence: PASS/);\n});\n\ntest("billing operations restore provider, seller and worker fail-closed requirements", () => {\n  const run = spawnSync(process.execPath, [auditPath], { env: { ...webOnlyEnv(), BILLING_OPERATIONS_READY: "true" }, encoding: "utf8" });\n  assert.notEqual(run.status, 0);\n  for (const name of ["MOYASAR_PUBLISHABLE_KEY", "MOYASAR_SECRET_KEY", "MOYASAR_WEBHOOK_SECRET", "BILLING_SELLER_LEGAL_NAME_AR", "BILLING_SELLER_ADDRESS_AR", "BILLING_TAX_STATUS", "HETZNER_HOST", "HETZNER_USER", "HETZNER_SSH_PRIVATE_KEY", "HETZNER_KNOWN_HOSTS"]) assert.match(run.stderr, new RegExp(name));\n});\n\ntest("Preflight makes the Moyasar read-only probe conditional with billing worker readiness", () => {\n  const start = preflight.indexOf("Verify Moyasar live secret credential read-only");\n  const end = preflight.indexOf("Verify Hetzner worker rollback baseline", start);\n  const segment = preflight.slice(start, end);\n  assert.ok(start >= 0 && end > start);\n  assert.match(segment, /PRODUCTION_BILLING_RENEWAL_ENABLED/);\n  assert.match(segment, /PRODUCTION_BILLING_OPERATIONS_READY/);\n  assert.match(preflight, /const billingRequired = billingRenewalEnabled \\|\\| billingOperationsReady/);\n});\n\ntest("paid checkout summary is a YAML block scalar", () => {\n  const start = paid.indexOf("Public paid launch summary");\n  const tail = paid.slice(start);\n  assert.ok(start >= 0);\n  assert.match(tail, /run: \\|\\n\\s+echo \\"production-open-paid-checkout: PASS/);\n  assert.doesNotMatch(tail, /run: echo \\"production-open-paid-checkout: PASS/);\n});\n''')
          PY
          git rm .github/workflows/round-131-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/production-config-presence-audit.mjs .github/workflows/production-preflight-v2.yml .github/workflows/production-open-paid-checkout.yml apps/web/tests/production-web-only-preflight-source-guards.test.ts
          git commit -m "fix(round-131): decouple web cutover from future billing credentials"
          git push origin HEAD:round-131-web-cutover-billing-decoupling
