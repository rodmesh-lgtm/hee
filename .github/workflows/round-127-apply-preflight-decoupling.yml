name: Round 127 Apply Preflight Decoupling
on:
  pull_request:
    branches: [hee-v6-rc]
permissions:
  contents: read
jobs:
  patch:
    if: github.head_ref == 'round-127-preflight-vps-decoupling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: round-127-preflight-vps-decoupling
      - name: Render guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          preflight = Path('.github/workflows/production-preflight-v2.yml')
          s = preflight.read_text()
          old = """          booleanValue('BILLING_RENEWAL_ENABLED');\n          booleanValue('BILLING_OPERATIONS_READY');"""
          new = """          const billingRenewalEnabled = booleanValue('BILLING_RENEWAL_ENABLED') === 'true';\n          const billingOperationsReady = booleanValue('BILLING_OPERATIONS_READY') === 'true';"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = """          required('VERCEL_TOKEN');\n          required('HETZNER_HOST'); required('HETZNER_USER'); required('HETZNER_SSH_PRIVATE_KEY'); required('HETZNER_KNOWN_HOSTS');"""
          new = """          required('VERCEL_TOKEN');\n          if (billingRenewalEnabled || billingOperationsReady) {\n            required('HETZNER_HOST'); required('HETZNER_USER'); required('HETZNER_SSH_PRIVATE_KEY'); required('HETZNER_KNOWN_HOSTS');\n          }"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = """      - name: Verify Hetzner worker rollback baseline and prerequisites read-only\n        run: |"""
          new = """      - name: Verify Hetzner worker rollback baseline and prerequisites read-only\n        if: ${{ vars.PRODUCTION_BILLING_RENEWAL_ENABLED == 'true' || vars.PRODUCTION_BILLING_OPERATIONS_READY == 'true' }}\n        run: |"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          preflight.write_text(s)

          att = Path('.github/scripts/production-config-attestation.mjs')
          s = att.read_text()
          anchor = "function equalHex(left, right) {"
          insert = """function billingWorkerRequired() {\n  return [\"BILLING_RENEWAL_ENABLED\", \"BILLING_OPERATIONS_READY\"].some(\n    (name) => String(process.env[name] ?? \"\").trim().toLowerCase() === \"true\",\n  );\n}\n\n"""
          assert s.count(anchor) == 1 and 'function billingWorkerRequired()' not in s
          s = s.replace(anchor, insert + anchor)
          old = """  const body = {\n    version: VERSION,\n    releaseSha: releaseSha(),\n    digests: {\n      \"release-core\": digest(\"release-core\"),\n      \"migration-core\": digest(\"migration-core\"),\n      \"worker-host\": digest(\"worker-host\"),\n    },\n  };\n  await writeFile(path, `${JSON.stringify(body)}\\n`, { encoding: \"utf8\", mode: 0o600 });\n  console.log(`production-config-attestation: WRITE PASS release=${body.releaseSha} scopes=3`);"""
          new = """  const digests = {\n    \"release-core\": digest(\"release-core\"),\n    \"migration-core\": digest(\"migration-core\"),\n  };\n  if (billingWorkerRequired()) digests[\"worker-host\"] = digest(\"worker-host\");\n  const body = {\n    version: VERSION,\n    releaseSha: releaseSha(),\n    digests,\n  };\n  await writeFile(path, `${JSON.stringify(body)}\\n`, { encoding: \"utf8\", mode: 0o600 });\n  console.log(`production-config-attestation: WRITE PASS release=${body.releaseSha} scopes=${Object.keys(digests).length}`);"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          att.write_text(s)
          PY
          git diff --check
          echo 'PREFLIGHT_B64_BEGIN'
          base64 -w0 .github/workflows/production-preflight-v2.yml
          echo
          echo 'PREFLIGHT_B64_END'
          echo 'ATTESTATION_B64_BEGIN'
          base64 -w0 .github/scripts/production-config-attestation.mjs
          echo
          echo 'ATTESTATION_B64_END'
