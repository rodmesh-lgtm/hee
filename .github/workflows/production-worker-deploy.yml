name: Production Billing Worker Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_EXACT_BILLING_WORKER to continue"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-billing-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_EXACT_BILLING_WORKER' && github.ref == 'refs/heads/hee-v6-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      HETZNER_HOST: ${{ vars.PRODUCTION_HETZNER_HOST }}
      HETZNER_USER: ${{ vars.PRODUCTION_HETZNER_USER }}
      HETZNER_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_HETZNER_SSH_PRIVATE_KEY }}
      HETZNER_KNOWN_HOSTS: ${{ secrets.PRODUCTION_HETZNER_KNOWN_HOSTS }}

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require content-proven RC Quality for release
        uses: ./.github/actions/require-release-quality
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve exact-SHA Production lifecycle evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count_green_dispatches() {
            workflow="$1"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "hee-v6-rc")] | length'
          }
          preflight_runs="$(count_green_dispatches production-preflight.yml)"
          web_runs="$(count_green_dispatches production-deploy.yml)"
          maintenance_runs="$(count_green_dispatches production-enter-maintenance.yml)"
          migration_runs="$(count_green_dispatches production-migrations.yml)"
          test "$preflight_runs" -ge 1 || (echo "Exact SHA has no green Production Preflight run" && exit 1)
          test "$web_runs" -ge 1 || (echo "Exact SHA has no successful Production Web Deploy run" && exit 1)
          {
            echo "HEE_MAINTENANCE_RUNS=${maintenance_runs}"
            echo "HEE_MIGRATION_RUNS=${migration_runs}"
          } >> "$GITHUB_ENV"
          echo "release-lifecycle-evidence: preflight=${preflight_runs} web=${web_runs} maintenance=${maintenance_runs} migrations=${migration_runs}"

      - name: Prove canonical web is exact-SHA and out of maintenance before worker cutover
        run: |
          set -euo pipefail
          release_json="$(curl --silent --show-error --fail --max-time 20 https://hee.sa/api/release)"
          status_json="$(curl --silent --show-error --fail --max-time 20 https://hee.sa/api/maintenance/status)"
          node - <<'NODE' "$release_json" "$status_json"
          const release = JSON.parse(process.argv[2]);
          const status = JSON.parse(process.argv[3]);
          const sha = process.env.GITHUB_SHA;
          if (release.releaseSha !== sha || release.environment !== "production") {
            throw new Error("Canonical /api/release does not prove the exact Production SHA");
          }
          if (status.releaseSha !== sha || status.environment !== "production" || status.maintenance !== false) {
            throw new Error("Canonical maintenance status is not exact-SHA non-maintenance Production");
          }
          NODE

      - name: Validate pinned SSH configuration
        run: |
          set -euo pipefail
          test -n "$HETZNER_HOST" || (echo "PRODUCTION_HETZNER_HOST is not configured" && exit 1)
          test -n "$HETZNER_USER" || (echo "PRODUCTION_HETZNER_USER is not configured" && exit 1)
          test -n "$HETZNER_SSH_PRIVATE_KEY" || (echo "PRODUCTION_HETZNER_SSH_PRIVATE_KEY is not configured" && exit 1)
          test -n "$HETZNER_KNOWN_HOSTS" || (echo "PRODUCTION_HETZNER_KNOWN_HOSTS is not configured" && exit 1)
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hee-production"
          chmod 0600 "$HOME/.ssh/hee-production"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Prove maintenance lifecycle before any possible worker unlock
        id: lifecycle
        run: |
          set -euo pipefail
          lock_state="$(ssh -i "$HOME/.ssh/hee-production" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            'if test -f /etc/hee/maintenance.lock; then printf true; else printf false; fi')"
          case "$lock_state" in true|false) ;; *) echo "Invalid maintenance lock state: ${lock_state}"; exit 1 ;; esac

          if [ "$lock_state" = "true" ]; then
            test "${HEE_MAINTENANCE_RUNS:-0}" -ge 1 || (echo "Maintenance lock exists but exact SHA has no successful maintenance entry run" && exit 1)
            test "${HEE_MIGRATION_RUNS:-0}" -ge 1 || (echo "Maintenance lock exists but exact SHA has no fully successful Production Migrations run; refusing unlock" && exit 1)
          elif [ "${HEE_MAINTENANCE_RUNS:-0}" -ge 1 ] && [ "${HEE_MIGRATION_RUNS:-0}" -lt 1 ]; then
            echo "Exact SHA has a successful maintenance entry but no successful migration run, while the maintenance lock is absent"
            exit 1
          fi

          echo "maintenance_lock=${lock_state}" >> "$GITHUB_OUTPUT"
          echo "worker-lifecycle-proof: PASS maintenance_lock=${lock_state} maintenance_runs=${HEE_MAINTENANCE_RUNS:-0} migration_runs=${HEE_MIGRATION_RUNS:-0}"

      - name: Package exact repository tree
        run: |
          set -euo pipefail
          git archive --format=tar "$GITHUB_SHA" | gzip -9 > "/tmp/hee-worker-${GITHUB_SHA}.tar.gz"
          test -s "/tmp/hee-worker-${GITHUB_SHA}.tar.gz"

      - name: Upload exact release archive
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/hee-production" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "/tmp/hee-worker-${GITHUB_SHA}.tar.gz" \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/hee-worker-${GITHUB_SHA}.tar.gz"

      - name: Prepare and atomically activate exact worker release with mandatory rollback
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hee-production" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            'bash -s --' "$GITHUB_SHA" "${{ steps.lifecycle.outputs.maintenance_lock }}" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          expected_lock="$2"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA"; exit 1; }
          case "$expected_lock" in true|false) ;; *) echo "Invalid expected maintenance lock state"; exit 1 ;; esac
          archive="/tmp/hee-worker-${sha}.tar.gz"
          stage="/tmp/hee-worker-stage-${sha}"
          release="/srv/hee/releases/${sha}"

          test -s "$archive"
          command -v node >/dev/null
          command -v npm >/dev/null
          command -v sudo >/dev/null
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = "24" || { echo "Worker host must run Node 24"; exit 1; }
          sudo -n test -r /etc/hee/production.env || { echo "/etc/hee/production.env is missing or unreadable"; exit 1; }
          sudo -n true || { echo "Deploy user requires restricted non-interactive sudo"; exit 1; }
          if [ "$expected_lock" = "true" ]; then
            test -f /etc/hee/maintenance.lock || { echo "Maintenance lock disappeared before worker preparation"; exit 1; }
          fi

          previous_release="$(readlink -f /srv/hee/current 2>/dev/null || true)"
          [[ "$previous_release" == /srv/hee/releases/* ]] || { echo "Existing worker current symlink is not a managed release"; exit 1; }
          test -d "$previous_release/apps/web" || { echo "Existing worker release is incomplete"; exit 1; }
          test -f "$previous_release/ops/systemd/hee-billing-renew.service" || { echo "Existing worker service unit is missing"; exit 1; }
          test -f "$previous_release/ops/systemd/hee-billing-renew.timer" || { echo "Existing worker timer unit is missing"; exit 1; }
          if sudo -n systemctl is-active --quiet hee-billing-renew.timer; then previous_timer_active=true; else previous_timer_active=false; fi
          if test -f /etc/hee/maintenance.lock; then previous_lock_state=true; else previous_lock_state=false; fi
          test "$previous_lock_state" = "$expected_lock" || { echo "Maintenance lock changed before worker cutover baseline capture"; exit 1; }
          echo "worker-cutover-baseline: release=${previous_release} timer_active=${previous_timer_active} maintenance_lock=${previous_lock_state}"

          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xzf "$archive" -C "$stage"
          cd "$stage/apps/web"
          npm ci
          npx prisma generate
          npm run typecheck
          printf 'RELEASE_SHA=%s\n' "$sha" > "$stage/release.env"

          sudo -n install -d -o root -g hee -m 0755 /srv/hee /srv/hee/releases
          if ! sudo -n test -d "$release"; then
            sudo -n mv "$stage" "$release"
            sudo -n chown -R root:hee "$release"
          else
            rm -rf "$stage"
          fi
          sudo -n chmod 0644 "$release/release.env"

          rollback_armed=false
          rollback_worker() {
            original_rc="$1"
            trap - EXIT
            if [ "$rollback_armed" != "true" ]; then
              exit "$original_rc"
            fi
            echo "Worker cutover failed after mutation began; restoring ${previous_release}"
            rollback_failed=false
            sudo -n systemctl stop hee-billing-renew.timer >/dev/null 2>&1 || rollback_failed=true
            sudo -n ln -sfn "$previous_release" /srv/hee/current.rollback || rollback_failed=true
            sudo -n mv -Tf /srv/hee/current.rollback /srv/hee/current || rollback_failed=true
            sudo -n install -o root -g root -m 0644 "$previous_release/ops/systemd/hee-billing-renew.service" /etc/systemd/system/hee-billing-renew.service || rollback_failed=true
            sudo -n install -o root -g root -m 0644 "$previous_release/ops/systemd/hee-billing-renew.timer" /etc/systemd/system/hee-billing-renew.timer || rollback_failed=true
            if [ "$previous_lock_state" = "true" ]; then
              sudo -n install -d -o root -g hee -m 0750 /etc/hee || rollback_failed=true
              sudo -n touch /etc/hee/maintenance.lock || rollback_failed=true
              sudo -n chown root:hee /etc/hee/maintenance.lock || rollback_failed=true
              sudo -n chmod 0640 /etc/hee/maintenance.lock || rollback_failed=true
              sudo -n install -d -o root -g root -m 0755 /etc/systemd/system/hee-billing-renew.service.d || rollback_failed=true
              printf '%s\n' '[Unit]' 'ConditionPathExists=!/etc/hee/maintenance.lock' | sudo -n tee /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf >/dev/null || rollback_failed=true
              sudo -n chmod 0644 /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf || rollback_failed=true
            else
              sudo -n rm -f /etc/hee/maintenance.lock || rollback_failed=true
              sudo -n rm -f /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf || rollback_failed=true
            fi
            sudo -n systemctl daemon-reload || rollback_failed=true
            if [ "$previous_timer_active" = "true" ] && [ "$previous_lock_state" = "false" ]; then
              sudo -n systemctl enable hee-billing-renew.timer >/dev/null 2>&1 || rollback_failed=true
              sudo -n systemctl start hee-billing-renew.timer >/dev/null 2>&1 || rollback_failed=true
            else
              sudo -n systemctl stop hee-billing-renew.timer >/dev/null 2>&1 || rollback_failed=true
            fi

            current_release="$(readlink -f /srv/hee/current 2>/dev/null || true)"
            [ "$current_release" = "$previous_release" ] || rollback_failed=true
            sudo -n systemctl cat hee-billing-renew.service | grep -q 'WorkingDirectory=/srv/hee/current/apps/web' || rollback_failed=true
            if [ "$previous_lock_state" = "true" ]; then
              test -f /etc/hee/maintenance.lock || rollback_failed=true
              ! sudo -n systemctl is-active --quiet hee-billing-renew.timer || rollback_failed=true
            else
              test ! -e /etc/hee/maintenance.lock || rollback_failed=true
              if [ "$previous_timer_active" = "true" ]; then sudo -n systemctl is-active --quiet hee-billing-renew.timer || rollback_failed=true; fi
            fi
            if [ "$rollback_failed" = "true" ]; then
              echo "worker-cutover-rollback-proof: CRITICAL FAIL"
              exit 71
            fi
            echo "worker-cutover-rollback-proof: PASS restored ${previous_release}"
            exit "$original_rc"
          }
          trap 'rollback_worker $?' EXIT

          # Stop future activations and never kill an already-running billing cycle.
          rollback_armed=true
          sudo -n systemctl stop hee-billing-renew.timer 2>/dev/null || true
          for _ in $(seq 1 120); do
            if ! sudo -n systemctl is-active --quiet hee-billing-renew.service; then break; fi
            sleep 10
          done
          if sudo -n systemctl is-active --quiet hee-billing-renew.service; then
            echo "Existing billing cycle did not finish within 20 minutes; refusing cutover"
            exit 1
          fi

          sudo -n ln -sfn "releases/${sha}" /srv/hee/current.next
          sudo -n mv -Tf /srv/hee/current.next /srv/hee/current
          sudo -n install -o root -g root -m 0644 /srv/hee/current/ops/systemd/hee-billing-renew.service /etc/systemd/system/hee-billing-renew.service
          sudo -n install -o root -g root -m 0644 /srv/hee/current/ops/systemd/hee-billing-renew.timer /etc/systemd/system/hee-billing-renew.timer
          sudo -n systemctl daemon-reload

          test "$(readlink -f /srv/hee/current)" = "$release"
          grep -qx "RELEASE_SHA=${sha}" /srv/hee/current/release.env
          sudo -n systemctl cat hee-billing-renew.service | grep -q 'WorkingDirectory=/srv/hee/current/apps/web'
          sudo -n systemctl cat hee-billing-renew.service | grep -q 'ConditionPathExists=!/etc/hee/maintenance.lock'
          if [ "$expected_lock" = "true" ]; then
            test -f /etc/hee/maintenance.lock || { echo "Maintenance lock disappeared before guarded unlock"; exit 1; }
          fi

          # Only now may this exact worker release clear the maintenance interlock.
          sudo -n rm -f /etc/hee/maintenance.lock
          sudo -n rm -f /etc/systemd/system/hee-billing-renew.service.d/maintenance.conf
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable hee-billing-renew.timer >/dev/null
          sudo -n systemctl start hee-billing-renew.timer

          test ! -e /etc/hee/maintenance.lock
          sudo -n systemctl is-active --quiet hee-billing-renew.timer
          test "$(readlink -f /srv/hee/current)" = "$release"
          grep -qx "RELEASE_SHA=${sha}" /srv/hee/current/release.env
          rollback_armed=false
          trap - EXIT
          rm -f "$archive"
          echo "worker-cutover-proof: PASS release=${sha} timer=active maintenance_lock=false"
          REMOTE

      - name: Verify worker release, cleared maintenance lock and active timer remotely
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hee-production" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "test \"\$(cat /srv/hee/current/release.env)\" = 'RELEASE_SHA=${GITHUB_SHA}' && test ! -e /etc/hee/maintenance.lock && sudo -n systemctl is-active --quiet hee-billing-renew.timer"

      - name: Re-prove canonical exact-SHA non-maintenance after worker unlock
        run: |
          set -euo pipefail
          status_json="$(curl --silent --show-error --fail --max-time 20 https://hee.sa/api/maintenance/status)"
          node -e 'const b=JSON.parse(process.argv[1]);if(b.releaseSha!==process.env.GITHUB_SHA||b.environment!=="production"||b.maintenance!==false)process.exit(1);' "$status_json"

      - name: Remove local SSH material and release archive
        if: always()
        run: rm -f "$HOME/.ssh/hee-production" "$HOME/.ssh/known_hosts" "/tmp/hee-worker-${GITHUB_SHA}.tar.gz"
