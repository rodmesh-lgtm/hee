name: Verify Outbound Deploy Flags
on:
  push:
    branches: [ops/verify-outbound-deploy-flags-20261005]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      OUTBOUND: ${{ vars.PRODUCTION_WHATSAPP_OUTBOUND_ENABLED }}
      WORKER: ${{ vars.PRODUCTION_WHATSAPP_MARKETING_WORKER_ENABLED }}
    steps:
      - name: Verify enabled deploy configuration
        run: |
          test "$OUTBOUND" = true
          test "$WORKER" = true
          echo "outbound-deploy-flags: PASS outbound=true worker=true"
