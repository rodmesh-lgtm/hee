name: Refresh Next security lock

on:
  push:
    branches: [infro-launch-hardening-2026]
    paths:
      - ".github/workflows/refresh-next-security-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: infro-launch-hardening-2026
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh patched production dependency lock
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact next@16.3.3 eslint-config-next@16.3.3
          npm audit fix --package-lock-only --omit=dev
          npm audit --omit=dev --audit-level=high
      - name: Commit generated dependency metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/package.json apps/web/package-lock.json; then
            echo "No dependency metadata changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m "fix: upgrade production dependency security patches"
          git push origin HEAD:infro-launch-hardening-2026
