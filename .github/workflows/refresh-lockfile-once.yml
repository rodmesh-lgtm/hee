name: Refresh Lockfile Once

on:
  push:
    branches: [hee-v6-rc]
    paths:
      - ".github/workflows/refresh-lockfile-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: hee-v6-rc
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh lockfile only
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched production dependency tree
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "security: refresh lockfile for patched nanoid"
          git push origin HEAD:hee-v6-rc
