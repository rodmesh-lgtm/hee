services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hee
      POSTGRES_USER: hee
      POSTGRES_PASSWORD: change-this-locally
    ports:
      - "5432:5432"
    volumes:
      - hee_postgres:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - hee_redis:/data

volumes:
  hee_postgres:
  hee_redis:
